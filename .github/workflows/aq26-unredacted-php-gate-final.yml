name: AQ26 Unredacted PHP Gate Final

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aq26-unredacted-php-gate-final.yml"

jobs:
  php-gate:
    name: Check unredacted auth and PHP execution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
      SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
      SSH_USER: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
      PUBLIC_HTML_A: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
      PUBLIC_HTML_B: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
      UNREDACTED_USER_SECRET: ${{ secrets.SCC_UNREDACTED_USERNAME }}

    steps:
      - name: Install SSH tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass curl

      - name: Validate required secrets
        run: |
          set -euo pipefail

          missing=0

          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "Missing required secret: $name"
              missing=1
            else
              echo "Secret present: $name"
            fi
          }

          check_secret "SCCAIRQUALITY_SSH_HOST" "$SSH_HOST"
          check_secret "SCCAIRQUALITY_SSH_PORT" "$SSH_PORT"
          check_secret "SCCAIRQUALITY_SSH_USERNAME" "$SSH_USER"
          check_secret "SCCAIRQUALITY_SSH_PASSWORD" "$SSH_PASSWORD"
          check_secret "SCC_UNREDACTED_PASSWORD" "$UNREDACTED_PASSWORD"

          PUBLIC_HTML="${PUBLIC_HTML_A:-$PUBLIC_HTML_B}"
          if [ -z "$PUBLIC_HTML" ]; then
            echo "Missing required secret: AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR or HOSTINGER_PUBLIC_HTML_DIR"
            missing=1
          else
            echo "Public HTML path present"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Create temporary PHP gate file inside unredacted folder
        run: |
          set -euo pipefail

          PUBLIC_HTML="${PUBLIC_HTML_A:-$PUBLIC_HTML_B}"
          TOKEN="AQ26_PHP_GATE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          REMOTE_FILE="$PUBLIC_HTML/unredacted/aq26-php-gate.php"

          cat > /tmp/aq26-php-gate.php <<PHP
          <?php
          header('Content-Type: text/plain; charset=utf-8');
          echo '${TOKEN}';
          ?>
          PHP

          echo "Uploading temporary PHP gate file to unredacted folder..."

          sshpass -p "$SSH_PASSWORD" ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$PUBLIC_HTML/unredacted'"

          sshpass -p "$SSH_PASSWORD" scp \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            /tmp/aq26-php-gate.php \
            "$SSH_USER@$SSH_HOST:$REMOTE_FILE"

          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Check unauthenticated access is blocked
        run: |
          set -euo pipefail

          URL="https://sccairquality.com/unredacted/aq26-php-gate.php"

          code="$(curl -k -L -s -o /tmp/aq26-unauth.txt -w "%{http_code}" "$URL" || true)"

          echo "Unauthenticated HTTP status: $code"

          if [ "$code" != "401" ]; then
            echo "Expected 401 for unauthenticated unredacted PHP gate file."
            echo "Response preview:"
            head -40 /tmp/aq26-unauth.txt || true
            exit 1
          fi

          echo "Unauthenticated access is correctly blocked."

      - name: Check authenticated PHP execution
        run: |
          set -euo pipefail

          URL="https://sccairquality.com/unredacted/aq26-php-gate.php"
          UNREDACTED_USER="${UNREDACTED_USER_SECRET:-aq26}"

          code="$(curl -k -L -s \
            -u "$UNREDACTED_USER:$UNREDACTED_PASSWORD" \
            -o /tmp/aq26-auth.txt \
            -w "%{http_code}" \
            "$URL" || true)"

          echo "Authenticated HTTP status: $code"

          if [ "$code" != "200" ]; then
            echo "Expected 200 for authenticated unredacted PHP gate file."
            echo "Response preview:"
            head -40 /tmp/aq26-auth.txt || true
            exit 1
          fi

          if ! grep -q "$TOKEN" /tmp/aq26-auth.txt; then
            echo "PHP gate token was not returned."
            echo "This may mean PHP is not executing, the wrong file was served, or auth reached the wrong location."
            echo "Response preview:"
            head -40 /tmp/aq26-auth.txt || true
            exit 1
          fi

          if grep -q "<?php" /tmp/aq26-auth.txt; then
            echo "PHP source appears to be exposed. Refusing to pass."
            exit 1
          fi

          echo "Authenticated PHP execution passed."

      - name: Remove temporary PHP gate file
        if: always()
        run: |
          set -euo pipefail

          PUBLIC_HTML="${PUBLIC_HTML_A:-$PUBLIC_HTML_B}"
          REMOTE_FILE="$PUBLIC_HTML/unredacted/aq26-php-gate.php"

          if [ -n "${SSH_HOST:-}" ] && [ -n "${SSH_PORT:-}" ] && [ -n "${SSH_USER:-}" ] && [ -n "${SSH_PASSWORD:-}" ]; then
            sshpass -p "$SSH_PASSWORD" ssh \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "$SSH_USER@$SSH_HOST" \
              "rm -f '$REMOTE_FILE'" || true
          fi
