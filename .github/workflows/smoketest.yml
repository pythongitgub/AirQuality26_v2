name: AQ26 Secret Smoke Test

on:
  workflow_dispatch:
    inputs:
      run_provider_checks:
        description: "Run safe provider smoke checks"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: aq26-secret-smoketest
  cancel-in-progress: true

jobs:
  smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}

      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}

      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      NEWSDATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      NEWSDATA_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}

      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}

      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
      EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
      PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth

      - name: Run AQ26 secret and provider smoke test
        run: |
          python scripts/smoketest.py

      - name: Upload smoke-test manifest
        uses: actions/upload-artifact@v4
        with:
          name: aq26-secret-smoketest-${{ github.run_id }}
          path: outputs/01_secrets_smoketest/
          if-no-files-found: warn
          retention-days: 7
