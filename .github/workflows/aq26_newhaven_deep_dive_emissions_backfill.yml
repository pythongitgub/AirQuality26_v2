name: AQ26 Newhaven Deep-Dive Emissions and Anomaly Backfill

on:
  workflow_dispatch:
    inputs:
      drive_fetch:
        description: "Use Google Drive service account inventory if configured"
        required: true
        default: false
        type: boolean
      max_rows_per_file:
        description: "Maximum CSV rows to scan per evidence file"
        required: true
        default: "50000"
        type: string
      deploy_public:
        description: "Deploy public site to Hostinger root"
        required: true
        default: false
        type: boolean
      deploy_unredacted:
        description: "Deploy unredacted site to /unredacted/"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Dry-run rsync deployment only"
        required: true
        default: true
        type: boolean
      remote_unredacted_subdir:
        description: "Remote protected folder under public_html"
        required: true
        default: "unredacted"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
  HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
  SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

jobs:
  newhaven-deep-dive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install optional dependencies
        if: ${{ inputs.drive_fetch }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Build Newhaven deep-dive evidence layer
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.drive_fetch }}" = "true" ]; then
            ARGS="$ARGS --drive-fetch"
          fi
          python scripts/aq26_newhaven_deep_dive_emissions_backfill.py \
            --repo-root . \
            --public-site site_public \
            --unredacted-site site_unredacted \
            --max-rows-per-file "${{ inputs.max_rows_per_file }}" \
            $ARGS

      - name: Validate Newhaven deep-dive outputs
        run: |
          set -euo pipefail
          test -f site_public/newhaven-deep-dive.html
          test -f site_public/data/newhaven/newhaven_deep_dive_summary.json
          test -f site_public/data/newhaven/emissions_evidence_chart.json
          test -f site_public/data/newhaven/weekly_anomaly_review_public.json
          test -f site_unredacted/data/newhaven/local_evidence_inventory.csv
          test -f site_unredacted/data/newhaven/anomaly_review_candidates.csv
          ! find site_public site_unredacted -name .htpasswd -print -quit | grep -q .

      - name: Commit Newhaven deep-dive outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/aq26_newhaven_deep_dive_emissions_backfill.py site_public site_unredacted docs .github/workflows/aq26_newhaven_deep_dive_emissions_backfill.yml || true
          git reset -- site_unredacted/.htpasswd site_public/.htpasswd 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Newhaven deep-dive changes to commit."
          else
            git commit -m "Add AQ26 Newhaven deep-dive emissions and anomaly backfill"
            git pull --rebase
            git push
          fi

      - name: Create unredacted password file for deployment only
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2-utils
          mkdir -p site_unredacted
          if [ -n "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          else
            echo 'aq26:disabled' > site_unredacted/.htpasswd
          fi
          cat > site_unredacted/.htaccess <<'EOF'
          AuthType Basic
          AuthName "AQ26 Unredacted Review"
          AuthUserFile .htpasswd
          Require valid-user
          Options -Indexes
          EOF
          echo 'User-agent: *' > site_unredacted/robots.txt
          echo 'Disallow: /' >> site_unredacted/robots.txt

      - name: Install deployment tools
        if: ${{ inputs.deploy_public || inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy public site
        if: ${{ inputs.deploy_public }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete --exclude '${{ inputs.remote_unredacted_subdir }}/***' -e "ssh $SSH_OPTS" site_public/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete --exclude '${{ inputs.remote_unredacted_subdir }}/***' -e "ssh $SSH_OPTS" site_public/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Deploy unredacted site
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${{ inputs.remote_unredacted_subdir }}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Upload Newhaven deep-dive artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-newhaven-deep-dive-emissions-anomaly
          path: |
            site_public/newhaven-deep-dive.html
            site_public/newhaven.html
            site_public/data/newhaven/
            site_unredacted/data/newhaven/
          if-no-files-found: error
