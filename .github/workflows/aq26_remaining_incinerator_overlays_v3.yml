name: AQ26 Remaining Incinerator Overlay Finder V3

on:
  workflow_dispatch:
    inputs:
      live_openaq:
        description: "Query OpenAQ live. If false, create/reclassify queue only."
        required: true
        default: true
        type: boolean
      use_v2_cache:
        description: "Reuse existing V2 candidate rows before making new API calls."
        required: true
        default: true
        type: boolean
      max_facilities:
        description: "Maximum remaining facilities to query this run. 0 = all. Use 5-10 to avoid rate limits."
        required: true
        default: "10"
        type: string
      radius_km:
        description: "Requested radius in km. OpenAQ point-radius calls are capped at 25 km."
        required: true
        default: "25"
        type: string
      limit_per_query:
        description: "OpenAQ limit per query variant."
        required: true
        default: "100"
        type: string
      min_score:
        description: "Minimum relevance score for selected review candidates."
        required: true
        default: "35"
        type: string
      sleep_seconds:
        description: "Delay between OpenAQ requests. Use 2.5 to 5 for full runs."
        required: true
        default: "3.0"
        type: string
      max_retries:
        description: "Retries for 429/timeouts."
        required: true
        default: "3"
        type: string
      exhaustive:
        description: "Run extra bbox/diagnostic variants. Slower; use for small batches only."
        required: true
        default: false
        type: boolean
      write_page:
        description: "Write site_public/incinerator-overlays.html"
        required: true
        default: true
        type: boolean
      commit_outputs:
        description: "Commit overlay outputs back to repo"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}

jobs:
  overlays-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure register inputs exist
        run: |
          set -euo pipefail
          mkdir -p configs/aq26_incinerator_register site_public/data/focus/overlays_v3
          test -f configs/aq26_incinerator_register/UK_Incinerators_with_Controls_Full_v3.csv
          test -f configs/aq26_incinerator_register/UK_Incinerators_with_DEFRA_Sites_v3_validated_Full.csv
          test -f scripts/aq26_find_remaining_incinerator_overlays_v3.py

      - name: Run remaining overlay finder V3
        run: |
          set -euo pipefail
          args=""
          if [ "${{ inputs.live_openaq }}" = "true" ]; then
            args="$args --live-openaq"
          fi
          if [ "${{ inputs.use_v2_cache }}" = "true" ]; then
            args="$args --use-v2-cache"
          fi
          if [ "${{ inputs.write_page }}" = "true" ]; then
            args="$args --write-page"
          fi
          if [ "${{ inputs.exhaustive }}" = "true" ]; then
            args="$args --exhaustive"
          fi
          python scripts/aq26_find_remaining_incinerator_overlays_v3.py \
            --broad-register configs/aq26_incinerator_register/UK_Incinerators_with_Controls_Full_v3.csv \
            --validated-overlays configs/aq26_incinerator_register/UK_Incinerators_with_DEFRA_Sites_v3_validated_Full.csv \
            --output-root site_public/data/focus/overlays_v3 \
            --site-root site_public \
            --radius-km "${{ inputs.radius_km }}" \
            --limit-per-query "${{ inputs.limit_per_query }}" \
            --max-facilities "${{ inputs.max_facilities }}" \
            --min-score "${{ inputs.min_score }}" \
            --sleep "${{ inputs.sleep_seconds }}" \
            --max-retries "${{ inputs.max_retries }}" \
            $args

      - name: Summarise overlay outputs
        run: |
          set -euo pipefail
          echo "--- incinerator_overlay_summary.json ---"
          cat site_public/data/focus/overlays_v3/incinerator_overlay_summary.json
          echo "--- output CSV counts ---"
          python -c "import csv,pathlib; files=['remaining_overlay_queue.csv','remaining_overlay_batch_queried.csv','candidate_monitoring_overlays.csv','selected_candidate_overlays_needing_review.csv','facility_overlay_status.csv','openaq_query_diagnostics.csv']; base=pathlib.Path('site_public/data/focus/overlays_v3'); [print(f'{f}: '+str(sum(1 for _ in csv.DictReader((base/f).open(encoding='utf-8')))) if (base/f).exists() else f'{f}: missing') for f in files]"

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-incinerator-overlays-v3
          path: |
            site_public/data/focus/overlays_v3/
            site_public/incinerator-overlays.html
          if-no-files-found: warn

      - name: Commit overlay outputs
        if: ${{ inputs.commit_outputs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_public/data/focus/overlays_v3 site_public/incinerator-overlays.html || true
          if git diff --cached --quiet; then
            echo "No overlay output changes to commit."
          else
            git commit -m "Add AQ26 remaining incinerator overlay V3 outputs"
            git pull --rebase
            git push
          fi
