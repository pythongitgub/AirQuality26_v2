name: AQ26 Website Overhaul Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/aq26_build_overhauled_site.py'
      - 'scripts/aq26_site_quality_gate.py'
      - 'scripts/aq26_deploy_hostinger_dual.py'
      - 'config/aq26_site_config.json'
      - '.github/workflows/aq26-site-overhaul-build-deploy.yml'

permissions:
  contents: write

jobs:
  build-quality-deploy:
    name: Build, validate and deploy AQ26 site
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deploy tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass curl
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build overhauled public and unredacted sites
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          python scripts/aq26_build_overhauled_site.py

      - name: Run AQ26 site quality gate
        run: |
          set -euo pipefail
          python scripts/aq26_site_quality_gate.py

      - name: Commit generated site files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_public site_unredacted config scripts requirements.txt .github/workflows/aq26-site-overhaul-build-deploy.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Overhaul AQ26 public and unredacted website"
            git push
          fi

      - name: Deploy to Hostinger
        env:
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
          AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
        run: |
          set -euo pipefail
          python scripts/aq26_deploy_hostinger_dual.py

      - name: Smoke test live public pages
        run: |
          set -euo pipefail
          for url in \
            https://sccairquality.com/ \
            https://sccairquality.com/newhaven.html \
            https://sccairquality.com/privacy.html \
            https://sccairquality.com/terms.html \
            https://sccairquality.com/sitemap.xml; do
            code=$(curl -k -L -s -o /tmp/aq26_page.html -w "%{http_code}" "$url" || true)
            echo "$url -> $code"
            case "$code" in 200|301|302) ;; *) exit 1 ;; esac
          done

      - name: Smoke test protected unredacted page
        env:
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          unauth_code=$(curl -k -L -s -o /tmp/aq26_unredacted_unauth.html -w "%{http_code}" "https://sccairquality.com/unredacted/newhaven.html" || true)
          auth_code=$(curl -k -L -s -u "aq26:${SCC_UNREDACTED_PASSWORD}" -o /tmp/aq26_unredacted_auth.html -w "%{http_code}" "https://sccairquality.com/unredacted/newhaven.html" || true)
          echo "Unauthenticated /unredacted/newhaven.html -> $unauth_code"
          echo "Authenticated /unredacted/newhaven.html -> $auth_code"
          test "$unauth_code" = "401"
          test "$auth_code" = "200"
