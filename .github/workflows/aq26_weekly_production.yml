name: AQ26 Weekly Production Evidence, Website, Drive and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_to_hostinger:
        description: "Deploy public + unredacted sites to Hostinger"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Dry-run rsync deployment only"
        required: true
        default: true
        type: boolean
      send_email:
        description: "Email final evidence bundle/report"
        required: true
        default: true
        type: boolean
      upload_to_drive:
        description: "Upload final bundle to Google Drive"
        required: true
        default: true
        type: boolean
      historical_backfill_weeks:
        description: "Historical weeks to update/plan this run"
        required: true
        default: "4"
        type: string
  schedule:
    # Two UTC triggers; a UK-time gate below lets only Monday 07:00 Europe/London proceed.
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"

permissions:
  contents: write
  actions: read

concurrency:
  group: aq26-weekly-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AQ26_CONFIG: configs/aq26_production.yml
  PYTHONUNBUFFERED: "1"

  # Data/API secrets. These are read by the production script only if present.
  CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
  CDSE_ID: ${{ secrets.CDSE_ID }}
  CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
  CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
  CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
  EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
  EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
  METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
  MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
  MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
  OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
  OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
  PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
  WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}

  # Email secrets.
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

  # Hostinger deployment secrets.
  HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
  SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

jobs:
  weekly-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Gate scheduled run to Monday 07:00 UK
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event != "schedule":
              print("should_run=true")
              print("reason=manual")
          else:
              now = datetime.now(ZoneInfo("Europe/London"))
              ok = now.weekday() == 0 and now.hour == 7
              print(f"should_run={'true' if ok else 'false'}")
              print(f"reason={now:%Y-%m-%d_%H:%M_%Z}")
          PY

      - name: Stop duplicate scheduled trigger
        if: ${{ steps.gate.outputs.should_run != 'true' }}
        run: |
          echo "Skipped duplicate schedule trigger: ${{ steps.gate.outputs.reason }}"

      - name: Install dependencies
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build weekly evidence, websites, report, provenance bundle
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        env:
          AQ26_HISTORICAL_BACKFILL_WEEKS: ${{ github.event.inputs.historical_backfill_weeks || '4' }}
        run: |
          set -euo pipefail
          python scripts/aq26_production_pipeline.py --config "$AQ26_CONFIG"

      - name: Create deployment-only unredacted password files
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.deploy_to_hostinger) }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2-utils
          rm -f site_unredacted/.htpasswd site_public/.htpasswd
          if [ -z "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            echo "SCC_UNREDACTED_PASSWORD is not set; refusing to create weak unredacted auth."
            exit 1
          fi
          htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          cat > site_unredacted/.htaccess <<'EOF'
          AuthType Basic
          AuthName "AQ26 Unredacted Review"
          AuthUserFile .htpasswd
          Require valid-user
          EOF
          printf 'User-agent: *\nDisallow: /\n' > site_unredacted/robots.txt

      - name: Install deployment tools
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.deploy_to_hostinger) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy public and unredacted sites to Hostinger
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.deploy_to_hostinger) }}
        shell: bash
        run: |
          set -euo pipefail
          : "${HOSTINGER_PUBLIC_HTML_DIR:?HOSTINGER_PUBLIC_HTML_DIR missing}"
          : "${SCCNEXUS_SSH_HOST:?SCCNEXUS_SSH_HOST missing}"
          : "${SCCNEXUS_SSH_PORT:?SCCNEXUS_SSH_PORT missing}"
          : "${SCCNEXUS_SSH_USERNAME:?SCCNEXUS_SSH_USERNAME missing}"
          : "${SCCNEXUS_SSH_PASSWORD:?SCCNEXUS_SSH_PASSWORD missing}"
          REMOTE_ROOT="${HOSTINGER_PUBLIC_HTML_DIR%/}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_ROOT' '$REMOTE_ROOT/unredacted'"
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then
            sshpass -e rsync -avzn --delete --exclude 'unredacted/***' -e "ssh $SSH_OPTS" site_public/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_ROOT/"
            sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_ROOT/unredacted/"
          else
            sshpass -e rsync -avz --delete --exclude 'unredacted/***' -e "ssh $SSH_OPTS" site_public/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_ROOT/"
            sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_ROOT/unredacted/"
          fi

      - name: Remove deployment-only auth files before commit/artifact
        if: always()
        run: rm -f site_unredacted/.htpasswd site_public/.htpasswd

      - name: Upload safe redaction failure summary
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aq26-redaction-failure-summary
          path: outputs/aq26_production/REDACTION_FAILURE_SUMMARY.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload weekly production artifact
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: aq26-weekly-production
          path: |
            outputs/aq26_production/**
            site_public/**
            site_unredacted/**
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated public outputs
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_public/ site_unredacted/ outputs/aq26_production/LATEST_WEEKLYV2.json outputs/aq26_production/latest_bundle_path.txt || true
          git reset -- site_unredacted/.htpasswd site_public/.htpasswd 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build AQ26 weekly production evidence and website"
            git pull --rebase
            git push
          fi

      - name: Upload final ZIP to Google Drive
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.upload_to_drive) }}
        run: python scripts/aq26_upload_to_gdrive.py --latest-path outputs/aq26_production/latest_bundle_path.txt

      - name: Email report and bundle
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.send_email) }}
        run: python scripts/aq26_send_production_email.py --latest-path outputs/aq26_production/latest_bundle_path.txt
