name: AQ26 Auth One Shot Final Key Auth

on:
  workflow_dispatch:

jobs:
  aq26-auth-one-shot-final-key:
    name: Diagnose and fix AQ26 unredacted auth using SSH key
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2-utils curl netcat-openbsd openssh-client

      - name: Check required secrets
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PRIVATE_KEY: ${{ secrets.SCCAIRQUALITY_SSH_PRIVATE_KEY }}
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR"
          test -n "$SCCAIRQUALITY_SSH_HOST"
          test -n "$SCCAIRQUALITY_SSH_PORT"
          test -n "$SCCAIRQUALITY_SSH_USERNAME"
          test -n "$SCCAIRQUALITY_SSH_PRIVATE_KEY"
          test -n "$SCC_UNREDACTED_PASSWORD"
          echo "Required secrets are present."

      - name: Prepare SSH key
        env:
          SCCAIRQUALITY_SSH_PRIVATE_KEY: ${{ secrets.SCCAIRQUALITY_SSH_PRIVATE_KEY }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SCCAIRQUALITY_SSH_PRIVATE_KEY" > ~/.ssh/aq26_hostinger_key
          chmod 600 ~/.ssh/aq26_hostinger_key
          ssh-keyscan -p "$SCCAIRQUALITY_SSH_PORT" "$SCCAIRQUALITY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: TCP port check
        env:
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
        run: |
          set -euo pipefail
          nc -vz -w 20 "$SCCAIRQUALITY_SSH_HOST" "$SCCAIRQUALITY_SSH_PORT"

      - name: Verify SSH connectivity first
        env:
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aq26_hostinger_key \
            -p "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" \
            'echo SSH_KEY_OK && pwd && whoami'

      - name: Create local auth files
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p auth_upload
          htpasswd -Bbn aq26 "$SCC_UNREDACTED_PASSWORD" > auth_upload/.htpasswd
          cat > auth_upload/.htaccess <<EOF
AuthType Basic
AuthName "AQ26 Unredacted"
AuthBasicProvider file
AuthUserFile ${AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR}/.htpasswd
Require valid-user
Options -Indexes
EOF
          htpasswd -vb auth_upload/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"

      - name: Backup existing remote auth files
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aq26_hostinger_key \
            -p "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" \
            "mkdir -p '$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR' &&
             cd '$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR' &&
             cp -f .htpasswd .htpasswd.bak 2>/dev/null || true &&
             cp -f .htaccess .htaccess.bak 2>/dev/null || true &&
             echo BACKUP_DONE"

      - name: Upload auth files
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/aq26_hostinger_key \
            -P "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            auth_upload/.htpasswd auth_upload/.htaccess \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR/"

      - name: Verify remote auth files
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/aq26_hostinger_key \
            -p "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" \
            "cd '$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR' &&
             ls -la .htpasswd .htaccess &&
             cat .htaccess &&
             cut -d: -f1 .htpasswd"

      - name: HTTP auth test
        env:
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          unauth_code=$(curl -k -L -s -o /tmp/aq26_unauth.html -w "%{http_code}" "https://sccairquality.com/unredacted/" || true)
          auth_code=$(curl -k -L -s -u "aq26:${SCC_UNREDACTED_PASSWORD}" -o /tmp/aq26_auth.html -w "%{http_code}" "https://sccairquality.com/unredacted/" || true)
          echo "Unauthenticated HTTP status: $unauth_code"
          echo "Authenticated HTTP status: $auth_code"
          test "$unauth_code" = "401"
          case "$auth_code" in
            200|301|302) echo "HTTP Basic Auth test passed for user aq26." ;;
            *) echo "HTTP Basic Auth failed for user aq26."; exit 1 ;;
          esac
