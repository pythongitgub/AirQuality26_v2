name: AQ26 Auth One Shot Final

on:
  workflow_dispatch:

jobs:
  aq26-auth-one-shot-final:
    name: Diagnose and fix AQ26 unredacted auth
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install required tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass apache2-utils curl

      - name: Check required secrets
        shell: bash
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR"
          test -n "$SCCAIRQUALITY_SSH_HOST"
          test -n "$SCCAIRQUALITY_SSH_PORT"
          test -n "$SCCAIRQUALITY_SSH_USERNAME"
          test -n "$SCCAIRQUALITY_SSH_PASSWORD"
          test -n "$SCC_UNREDACTED_PASSWORD"
          echo "Required secrets are present."

      - name: Verify SSH connectivity
        shell: bash
        env:
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"
          sshpass -e ssh \
            -p "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" \
            'echo SSH_OK && pwd && whoami'

      - name: Create local auth files
        shell: bash
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p auth_upload
          htpasswd -Bbn aq26 "$SCC_UNREDACTED_PASSWORD" > auth_upload/.htpasswd
          {
            echo 'AuthType Basic'
            echo 'AuthName "AQ26 Unredacted"'
            echo 'AuthBasicProvider file'
            echo "AuthUserFile ${AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR}/.htpasswd"
            echo 'Require valid-user'
            echo 'Options -Indexes'
          } > auth_upload/.htaccess
          htpasswd -vb auth_upload/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          ls -la auth_upload

      - name: Backup existing remote auth files
        shell: bash
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"
          sshpass -e ssh \
            -p "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" \
            "mkdir -p '$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR' && cd '$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR' && cp -f .htpasswd .htpasswd.bak 2>/dev/null || true; cp -f .htaccess .htaccess.bak 2>/dev/null || true; echo BACKUP_DONE"

      - name: Upload auth files
        shell: bash
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"
          sshpass -e scp \
            -P "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            auth_upload/.htpasswd auth_upload/.htaccess \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR/"

      - name: Verify remote auth files
        shell: bash
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"
          sshpass -e ssh \
            -p "$SCCAIRQUALITY_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" \
            "cd '$AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR' && ls -la .htpasswd .htaccess && echo '--- .htaccess ---' && cat .htaccess && echo '--- .htpasswd users ---' && cut -d: -f1 .htpasswd"

      - name: HTTP auth test
        shell: bash
        env:
          SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
        run: |
          set -euo pipefail
          unauth_code=$(curl -k -L -s -o /tmp/aq26_unauth.html -w "%{http_code}" "https://sccairquality.com/unredacted/" || true)
          auth_code=$(curl -k -L -s -u "aq26:${SCC_UNREDACTED_PASSWORD}" -o /tmp/aq26_auth.html -w "%{http_code}" "https://sccairquality.com/unredacted/" || true)
          echo "Unauthenticated HTTP status: $unauth_code"
          echo "Authenticated HTTP status: $auth_code"
          test "$unauth_code" = "401"
          case "$auth_code" in
            200|301|302)
              echo "HTTP Basic Auth test passed for user aq26."
              ;;
            *)
              echo "HTTP Basic Auth failed for user aq26."
              head -40 /tmp/aq26_auth.html || true
              exit 1
              ;;
          esac
