name: AQ26 WeeklyV2 SCC Nexus Website

on:
  workflow_dispatch:
    inputs:
      lookback_days: {description: "Days of evidence to harvest", required: false, default: "14"}
      history_weeks: {description: "Historical weekly slots. 104 = two years", required: false, default: "104"}
      history_end_date: {description: "Inclusive validated history end date", required: false, default: "2026-05-25"}
      deploy_to_hostinger: {description: "Deploy to Hostinger", required: false, default: "true", type: choice, options: ["true","false"]}
      remote_subdir: {description: "Remote subdirectory. Use . to deploy to the root of sccwebdesigntest.co.uk", required: false, default: "."}
      public_base_url: {description: "Public URL to verify after deploy", required: false, default: "https://sccwebdesigntest.co.uk"}
      send_email: {description: "Email final evidence ZIP", required: false, default: "true", type: choice, options: ["true","false"]}
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: aq26-weeklyv2-sccnexus-website
  cancel-in-progress: false

jobs:
  weeklyv2-sccnexus-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      AQ26_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      AQ26_HISTORY_WEEKS: ${{ github.event.inputs.history_weeks || '104' }}
      AQ26_HISTORY_END_DATE: ${{ github.event.inputs.history_end_date || '2026-05-25' }}
      AQ26_REMOTE_SUBDIR: ${{ github.event.inputs.remote_subdir || '.' }}
      AQ26_PUBLIC_BASE_URL: ${{ github.event.inputs.public_base_url || 'https://sccwebdesigntest.co.uk' }}
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
      CAMS_BASE_URL: ${{ secrets.CAMS_BASE_URL }}
      EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
      PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
      SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
      SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
      SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
      GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
      GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
      GITHUB_SHA_VALUE: ${{ github.sha }}
      GITHUB_REF_VALUE: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate AQ26 files
        run: |
          set -euo pipefail
          test -f configs/aq26_weekly_v2_sources.yml
          test -f scripts/aq26_weeklyv2_collect.py
          test -f scripts/aq26_weeklyv2_cdse_auth_probe.py
          test -f scripts/aq26_weeklyv2_sanitize_outputs.py
          test -f scripts/aq26_weeklyv2_redaction_audit.py
          test -f scripts/aq26_weeklyv2_update_gates.py
          test -f scripts/aq26_weeklyv2_build_report.py
          test -f scripts/aq26_weeklyv2_build_sccnexus_site.py
          test -f website/assets/brand/air_quality_web.svg
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml reportlab google-api-python-client google-auth python-dateutil
      - name: Restore existing website history from Hostinger
        if: ${{ github.event.inputs.deploy_to_hostinger != 'false' }}
        env:
          HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
          PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
          USER: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
          PASS: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
          BASE_TARGET: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          mkdir -p outputs/website_history
          if [ "$AQ26_REMOTE_SUBDIR" = "." ] || [ -z "$AQ26_REMOTE_SUBDIR" ]; then TARGET="${BASE_TARGET%/}"; else TARGET="${BASE_TARGET%/}/${AQ26_REMOTE_SUBDIR}"; fi
          mkdir -p _remote_history
          sshpass -p "$PASS" rsync -az --timeout=60 -e "ssh -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30" "$USER@$HOST:$TARGET/data/history/" _remote_history/ || true
          cp -R _remote_history/. outputs/website_history/ || true
          sshpass -p "$PASS" rsync -az --timeout=60 -e "ssh -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30" "$USER@$HOST:$TARGET/data/weekly_index.json" outputs/website_history/weekly_index.previous.json || true
      - name: WeeklyV2 controlled evidence harvest
        run: python scripts/aq26_weeklyv2_collect.py --config configs/aq26_weekly_v2_sources.yml --output-root outputs --lookback-days "$AQ26_LOOKBACK_DAYS"
      - name: WeeklyV2 CDSE dual-auth probe
        run: python scripts/aq26_weeklyv2_cdse_auth_probe.py --output-root outputs
      - name: Sanitize provider outputs before redaction audit
        run: python scripts/aq26_weeklyv2_sanitize_outputs.py --root outputs
      - name: Redaction audit before report
        run: python scripts/aq26_weeklyv2_redaction_audit.py --root outputs --fail-on-leak true
      - name: Update readiness gates after redaction
        run: python scripts/aq26_weeklyv2_update_gates.py --output-root outputs
      - name: Build WeeklyV2 evidence bundle
        run: python scripts/aq26_weeklyv2_build_report.py --output-root outputs
      - name: Sanitize final report outputs
        run: python scripts/aq26_weeklyv2_sanitize_outputs.py --root outputs
      - name: Redaction audit after report
        run: python scripts/aq26_weeklyv2_redaction_audit.py --root outputs --fail-on-leak true
      - name: Update readiness gates after final redaction
        run: python scripts/aq26_weeklyv2_update_gates.py --output-root outputs
      - name: Rebuild final bundle including audit and corrected gates
        run: python scripts/aq26_weeklyv2_build_report.py --output-root outputs

      - name: Build two-year validated weekly history index
        run: |
          python scripts/aq26_weeklyv2_build_two_year_history.py \
            --output-root outputs \
            --history-weeks "$AQ26_HISTORY_WEEKS" \
            --end-date "$AQ26_HISTORY_END_DATE"

      - name: Build SCC Nexus styled AQ26 website
        run: python scripts/aq26_weeklyv2_build_sccnexus_site.py --output-root outputs --site-root site_public --history-weeks "$AQ26_HISTORY_WEEKS" --asset-root website/assets --remote-subdir "$AQ26_REMOTE_SUBDIR" \
            --history-end-date "$AQ26_HISTORY_END_DATE"
      - name: Validate generated website
        run: |
          set -euo pipefail
          for f in index.html archive.html comparisons.html source-records.html readiness.html methodology.html downloads.html about.html privacy.html cookies.html accessibility.html terms.html contact.html; do test -f "site_public/$f"; done
          test -f site_public/assets/site.css
          test -f site_public/assets/site.js
          test -f site_public/assets/favicon.svg
          test -f site_public/data/weekly_index.json
          test -f site_public/data/latest_summary.json
          grep -qi "AQ26 Environmental Intelligence Observatory" site_public/index.html
          grep -qi "cookie-banner" site_public/index.html
          python -m json.tool site_public/data/weekly_index.json >/dev/null
          python -m json.tool site_public/data/latest_summary.json >/dev/null

      - name: Upload AQ26 pre-deploy website and evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weeklyv2-predeploy-site-${{ github.run_id }}
          path: |
            outputs/weeklyv2_reports/*.zip
            outputs/00_weeklyv2/LATEST_WEEKLYV2.json
            outputs/website_history/
            outputs/99_integrity/
            site_public/
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy AQ26 website to Hostinger
        if: ${{ github.event.inputs.deploy_to_hostinger != 'false' }}
        env:
          HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
          PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
          USER: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
          PASS: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
          BASE_TARGET: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          if [ "$AQ26_REMOTE_SUBDIR" = "." ] || [ -z "$AQ26_REMOTE_SUBDIR" ]; then TARGET="${BASE_TARGET%/}"; else TARGET="${BASE_TARGET%/}/${AQ26_REMOTE_SUBDIR}"; fi
          sshpass -p "$PASS" ssh -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=30 "$USER@$HOST" "mkdir -p '$TARGET'"
          sshpass -p "$PASS" rsync -az --delete --timeout=180 -e "ssh -p $PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=3" site_public/ "$USER@$HOST:$TARGET/"

      - name: Verify public AQ26 deployment
        if: ${{ github.event.inputs.deploy_to_hostinger != 'false' }}
        run: |
          set -euo pipefail
          BASE="${AQ26_PUBLIC_BASE_URL%/}"
          echo "Verifying public deployment at: $BASE"
          sleep 10
          curl -fsSL "$BASE/index.html?v=${GITHUB_RUN_ID_VALUE}" -o /tmp/aq26_index.html
          curl -fsSL "$BASE/privacy.html?v=${GITHUB_RUN_ID_VALUE}" -o /tmp/aq26_privacy.html
          curl -fsSL "$BASE/cookies.html?v=${GITHUB_RUN_ID_VALUE}" -o /tmp/aq26_cookies.html
          curl -fsSL "$BASE/data/weekly_index.json?v=${GITHUB_RUN_ID_VALUE}" -o /tmp/aq26_weekly_index.json
          grep -qi "AQ26 Environmental Intelligence Observatory" /tmp/aq26_index.html
          grep -qi "air_quality_web.svg" /tmp/aq26_index.html
          grep -qi "cookie-banner" /tmp/aq26_index.html
          grep -qi "Privacy" /tmp/aq26_privacy.html
          grep -qi "Cookies" /tmp/aq26_cookies.html
          python -m json.tool /tmp/aq26_weekly_index.json >/dev/null
          echo "Verified AQ26 public deployment at $BASE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AQ26 website and evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weeklyv2-sccnexus-site-${{ github.run_id }}
          path: |
            outputs/weeklyv2_reports/*.zip
            outputs/00_weeklyv2/LATEST_WEEKLYV2.json
            outputs/99_integrity/
            site_public/
          if-no-files-found: warn
          retention-days: 30
      - name: Send WeeklyV2 evidence email
        if: ${{ github.event.inputs.send_email != 'false' }}
        run: python scripts/aq26_weeklyv2_send_email.py --output-root outputs
