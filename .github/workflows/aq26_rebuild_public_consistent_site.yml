name: AQ26 Rebuild Public Site Consistently

on:
  workflow_dispatch:
    inputs:
      commit_outputs:
        description: "Commit rebuilt public pages"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild public site with consistent template
        run: |
          set -euo pipefail
          python scripts/aq26_rebuild_public_site_consistent.py \
            --site-root site_public \
            --asset-source website/assets \
            --force
      - name: Commit rebuilt public site
        if: ${{ inputs.commit_outputs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site_public scripts/aq26_rebuild_public_site_consistent.py website/assets docs || true
          if git diff --cached --quiet; then
            echo "No public site changes to commit."
          else
            git commit -m "Rebuild AQ26 public site with consistent readable template"
            git push
          fi
