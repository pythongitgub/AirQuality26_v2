name: AQ26 Deploy Password-Protected Unredacted Site

on:
  workflow_dispatch:
    inputs:
      remote_subdir:
        description: "Remote subdirectory under public_html"
        required: true
        default: "unredacted"
        type: string
      dry_run:
        description: "Dry run only; do not upload"
        required: true
        default: true
        type: boolean
      max_copy_mb:
        description: "Maximum site_unredacted size to deploy"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

jobs:
  deploy-unredacted:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      REMOTE_SUBDIR: ${{ inputs.remote_subdir }}
      DRY_RUN: ${{ inputs.dry_run }}
      MAX_COPY_MB: ${{ inputs.max_copy_mb }}
      HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
      SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
      SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
      SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
      SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass apache2-utils rsync

      - name: Build unredacted site
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_unredacted_site.py ]; then
            python scripts/aq26_build_unredacted_site.py --output site_unredacted
          else
            mkdir -p site_unredacted
            cat > site_unredacted/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <title>AQ26 Unredacted Evidence Review</title>
            <style>
              body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#0f172a;color:#e5e7eb}
              main{max-width:980px;margin:0 auto;padding:48px 20px}
              .card{background:#111827;border:1px solid #334155;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
              h1{font-size:clamp(2rem,4vw,3.5rem);margin:0 0 12px}
              p{line-height:1.6;color:#cbd5e1}
              .badge{display:inline-block;background:#0369a1;color:white;border-radius:999px;padding:8px 12px;font-weight:700}
            </style>
          </head>
          <body>
            <main>
              <div class="card">
                <span class="badge">Restricted</span>
                <h1>AQ26 Unredacted Evidence Review</h1>
                <p>This password-protected area is for internal QA, provenance review and unredacted evidence checks.</p>
                <p>If you can see this page after logging in, the protected deployment is working.</p>
              </div>
            </main>
          </body>
          </html>
          HTML
          fi

      - name: Add Basic Auth and no-index files
        run: |
          set -euo pipefail

          : "${HOSTINGER_PUBLIC_HTML_DIR:?HOSTINGER_PUBLIC_HTML_DIR secret is required}"
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD secret is required}"

          mkdir -p site_unredacted

          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${REMOTE_SUBDIR#/}"

          htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"

          {
            echo "DirectoryIndex index.html"
            echo "Options -Indexes"
            echo "AuthType Basic"
            echo "AuthName \"AQ26 restricted evidence review\""
            echo "AuthUserFile ${REMOTE_DIR}/.htpasswd"
            echo "Require valid-user"
            echo "<IfModule mod_headers.c>"
            echo "  Header set X-Robots-Tag \"noindex, nofollow, noarchive\""
            echo "</IfModule>"
          } > site_unredacted/.htaccess

          {
            echo "User-agent: *"
            echo "Disallow: /"
          } > site_unredacted/robots.txt

          test -f site_unredacted/index.html
          test -f site_unredacted/.htaccess
          test -f site_unredacted/.htpasswd

          echo "Prepared protected site files:"
          find site_unredacted -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Safety size check
        run: |
          set -euo pipefail
          SIZE_MB=$(du -sm site_unredacted | awk '{print $1}')
          echo "site_unredacted size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt "$MAX_COPY_MB" ]; then
            echo "Refusing to deploy: size ${SIZE_MB} MB exceeds MAX_COPY_MB=${MAX_COPY_MB}"
            exit 1
          fi

      - name: Deploy to Hostinger subdirectory
        run: |
          set -euo pipefail

          : "${SCCNEXUS_SSH_HOST:?SCCNEXUS_SSH_HOST secret is required}"
          : "${SCCNEXUS_SSH_USERNAME:?SCCNEXUS_SSH_USERNAME secret is required}"
          : "${SCCNEXUS_SSH_PASSWORD:?SCCNEXUS_SSH_PASSWORD secret is required}"
          : "${SCCNEXUS_SSH_PORT:?SCCNEXUS_SSH_PORT secret is required}"
          : "${HOSTINGER_PUBLIC_HTML_DIR:?HOSTINGER_PUBLIC_HTML_DIR secret is required}"

          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${REMOTE_SUBDIR#/}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no"

          echo "Remote target: ${REMOTE_DIR}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: showing files that would be uploaded"
            find site_unredacted -maxdepth 2 -type f -printf "%p\n" | sort
            exit 0
          fi

          sshpass -p "$SCCNEXUS_SSH_PASSWORD" ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"

          sshpass -p "$SCCNEXUS_SSH_PASSWORD" rsync -avz \
            -e "ssh $SSH_OPTS" \
            site_unredacted/ \
            "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"

          echo "Remote file listing:"
          sshpass -p "$SCCNEXUS_SSH_PASSWORD" ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "ls -la '$REMOTE_DIR' && test -f '$REMOTE_DIR/index.html' && test -f '$REMOTE_DIR/.htaccess' && test -f '$REMOTE_DIR/.htpasswd'"
