name: AQ26 Deploy Password-Protected Unredacted Site

on:
  workflow_dispatch:
    inputs:
      remote_subdir:
        description: "Remote subdirectory under public_html"
        required: true
        default: "unredacted"
        type: string
      dry_run:
        description: "Preview deployment only"
        required: true
        default: true
        type: boolean
      max_copy_mb:
        description: "Safety cap for generated unredacted payload size"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

jobs:
  build-and-deploy-unredacted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
      HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
      SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
      SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
      SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build unredacted site
        run: |
          python scripts/aq26_build_unredacted_site.py
          test -f site_unredacted/index.html
          test -f site_unredacted/robots.txt
          echo "Built files:"
          find site_unredacted -maxdepth 3 -type f -print

      - name: Install deploy tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync apache2-utils

      - name: Validate required secrets
        run: |
          missing=0
          for name in SCC_UNREDACTED_PASSWORD HOSTINGER_PUBLIC_HTML_DIR SCCNEXUS_SSH_HOST SCCNEXUS_SSH_PORT SCCNEXUS_SSH_USERNAME SCCNEXUS_SSH_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Add Basic Auth files
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SUBDIR="${{ inputs.remote_subdir }}"
          REMOTE_SUBDIR="${REMOTE_SUBDIR#/}"
          REMOTE_SUBDIR="${REMOTE_SUBDIR%/}"
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${REMOTE_SUBDIR}"
          echo "REMOTE_DIR=$REMOTE_DIR" >> "$GITHUB_ENV"

          # Create htpasswd with bcrypt via apache2-utils; username is aq26.
          htpasswd -bcB site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"

          cat > site_unredacted/.htaccess <<EOF
DirectoryIndex index.html
Options -Indexes
AuthType Basic
AuthName "AQ26 Unredacted Review"
AuthUserFile ${REMOTE_DIR}/.htpasswd
Require valid-user
<FilesMatch "^\\.(htaccess|htpasswd)$">
  Require all denied
</FilesMatch>
Header set X-Robots-Tag "noindex, nofollow, noarchive"
EOF
          echo "Created Basic Auth files. Sanitised .htaccess preview:"
          sed 's#AuthUserFile .*#AuthUserFile [remote path hidden]#' site_unredacted/.htaccess

      - name: Safety size check
        run: |
          BYTES=$(du -sb site_unredacted | awk '{print $1}')
          MAX=$(( ${{ inputs.max_copy_mb }} * 1024 * 1024 ))
          echo "site_unredacted bytes=$BYTES max=$MAX"
          if [ "$BYTES" -gt "$MAX" ]; then
            echo "Refusing deployment: generated unredacted payload exceeds max_copy_mb."
            exit 1
          fi

      - name: Ensure remote directory exists
        run: |
          sshpass -p "$SCCNEXUS_SSH_PASSWORD" ssh -p "$SCCNEXUS_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" \
            "mkdir -p '$REMOTE_DIR' && chmod 755 '$REMOTE_DIR'"

      - name: Dry-run deploy
        if: ${{ inputs.dry_run }}
        run: |
          sshpass -p "$SCCNEXUS_SSH_PASSWORD" rsync -avz --dry-run \
            -e "ssh -p $SCCNEXUS_SSH_PORT -o StrictHostKeyChecking=no" \
            site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: |
          sshpass -p "$SCCNEXUS_SSH_PASSWORD" rsync -avz \
            -e "ssh -p $SCCNEXUS_SSH_PORT -o StrictHostKeyChecking=no" \
            site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          sshpass -p "$SCCNEXUS_SSH_PASSWORD" ssh -p "$SCCNEXUS_SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" \
            "find '$REMOTE_DIR' -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | head -50"

      - name: Post-deploy URL note
        run: |
          echo "Expected URL: https://sccwebdesigntest.co.uk/${{ inputs.remote_subdir }}/"
          echo "If a login prompt appears, use username aq26 and the SCC_UNREDACTED_PASSWORD secret value."
