name: AQ26 Deploy Password-Protected Unredacted Site

on:
  workflow_dispatch:
    inputs:
      remote_subdir:
        description: "Remote subfolder under HOSTINGER_PUBLIC_HTML_DIR"
        required: true
        default: "unredacted"
        type: string
      dry_run:
        description: "Dry run only; do not upload files"
        required: true
        default: true
        type: boolean
      max_index_files:
        description: "Maximum evidence files to list on internal evidence page"
        required: true
        default: "250"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy-unredacted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOTE_SUBDIR: ${{ inputs.remote_subdir }}
      HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
      SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
      SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
      SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
      SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync apache2-utils

      - name: Build full unredacted website
        run: |
          python scripts/aq26_build_unredacted_site.py --repo-root . --public-site site_public --output-site site_unredacted --max-index-files "${{ inputs.max_index_files }}"
          test -f site_unredacted/index.html
          test -f site_unredacted/evidence.html
          test -f site_unredacted/assets/aq26_unredacted.css
          test -f site_unredacted/robots.txt
          find site_unredacted -maxdepth 3 -type f | sort | head -100

      - name: Add server Basic Auth files
        run: |
          set -euo pipefail
          if [ -z "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            echo "SCC_UNREDACTED_PASSWORD secret is missing" >&2
            exit 1
          fi
          if [ -z "${HOSTINGER_PUBLIC_HTML_DIR:-}" ]; then
            echo "HOSTINGER_PUBLIC_HTML_DIR secret is missing" >&2
            exit 1
          fi
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${REMOTE_SUBDIR}"
          htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          {
            echo "DirectoryIndex index.html"
            echo "Options -Indexes"
            echo "AuthType Basic"
            echo "AuthName AQ26_Unredacted_Review"
            echo "AuthUserFile ${REMOTE_DIR}/.htpasswd"
            echo "Require valid-user"
            echo "Header set X-Robots-Tag \"noindex, nofollow, noarchive\""
          } > site_unredacted/.htaccess
          echo "Auth files created. AuthUserFile path: ${REMOTE_DIR}/.htpasswd"
          ls -la site_unredacted | sed -n '1,80p'

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          for name in SCCNEXUS_SSH_HOST SCCNEXUS_SSH_USERNAME SCCNEXUS_SSH_PASSWORD HOSTINGER_PUBLIC_HTML_DIR SCC_UNREDACTED_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
          if [ -z "${SCCNEXUS_SSH_PORT:-}" ]; then
            echo "SCCNEXUS_SSH_PORT missing; defaulting to 22"
            echo "SCCNEXUS_SSH_PORT=22" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Hostinger unredacted subfolder
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${REMOTE_SUBDIR}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: would deploy contents of site_unredacted/ to $REMOTE_DIR/"
            rsync -avzn --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            rsync -avz --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
            sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "find '$REMOTE_DIR' -maxdepth 2 -type f -printf '%p %s bytes\n' | sort | head -80"
          fi

      - name: Deployment summary
        run: |
          echo "Unredacted URL: https://sccwebdesigntest.co.uk/${{ inputs.remote_subdir }}/"
          echo "Username: aq26"
          echo "Dry run: ${{ inputs.dry_run }}"
