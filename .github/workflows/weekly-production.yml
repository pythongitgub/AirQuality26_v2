name: AQ26 Weekly Production Evidence, Website, Drive and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_to_hostinger:
        description: "Deploy site_public, site_unredacted and site_test to sccairquality.com"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      dry_run:
        description: "Dry-run deployment only"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_to_drive:
        description: "Upload final evidence bundle to Google Drive if Drive secrets are available"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      send_email:
        description: "Send completion email if SMTP/Mail secrets are available"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    # Monday 07:00 UK local equivalent is hard to express across BST/GMT in cron.
    # This runs at 07:00 UTC. The report itself records Europe/London timestamps.
    - cron: "0 7 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: aq26-weekly-production
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  AQ26_TIMEZONE: Europe/London

jobs:
  weekly-production:
    name: Build, validate, optimise and optionally deploy
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Workflow consolidation warning
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aq26_workflow_guard.py --mode warn --allowed weekly-production.yml aq26-hostinger-ssh-preflight.yml

      - name: Run AQ26 production pipeline
        shell: bash
        env:
          CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
          MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
          MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/aq26_production_pipeline.py --config configs/aq26_production.yml

      - name: Build lean interactive website layer and SEO files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aq26_site_nextlevel.py --config configs/aq26_nextlevel_site.yml

      - name: Validate public/unredacted split and website QA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aq26_site_quality_gate.py --config configs/aq26_nextlevel_site.yml

      - name: Remove oversized files from publish folders before artifact/deploy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aq26_prune_publish_folders.py --max-mb 25 --write-notices true

      - name: Upload weekly website artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weekly-site-and-report
          retention-days: 21
          if-no-files-found: error
          path: |
            site_public/**
            site_unredacted/**
            site_test/**
            outputs/aq26_production/LATEST_WEEKLYV2.json
            outputs/aq26_production/latest_run_dir.txt
            outputs/aq26_production/latest_bundle_path.txt

      - name: Upload final evidence bundle to Google Drive
        if: ${{ inputs.upload_to_drive == 'true' || github.event_name == 'schedule' }}
        shell: bash
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GDRIVE_FOLDER_ID:-}" ]; then
            echo "GDRIVE_FOLDER_ID missing; skipping Drive upload."
            exit 0
          fi
          if [ -f scripts/aq26_upload_to_drive.py ]; then
            python scripts/aq26_upload_to_drive.py || echo "Drive upload script returned non-zero; build/deploy will continue."
          elif [ -f scripts/aq26_upload_to_gdrive.py ]; then
            python scripts/aq26_upload_to_gdrive.py || echo "Drive upload script returned non-zero; build/deploy will continue."
          else
            echo "No Drive upload script found; skipping."
          fi

      - name: Deploy to Hostinger
        if: ${{ inputs.deploy_to_hostinger == 'true' || github.event_name == 'schedule' }}
        shell: bash
        env:
          AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
          HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/aq26_deploy_hostinger.py --config configs/aq26_weekly_runtime.yml --dry-run "${{ inputs.dry_run || 'false' }}"

      - name: Send completion email
        if: ${{ inputs.send_email == 'true' }}
        shell: bash
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_send_production_email.py ]; then
            python scripts/aq26_send_production_email.py || echo "Email step failed but production build/deploy completed."
          elif [ -f scripts/aq26_send_email.py ]; then
            python scripts/aq26_send_email.py || echo "Email step failed but production build/deploy completed."
          else
            echo "No AQ26 email script found; skipping."
          fi
