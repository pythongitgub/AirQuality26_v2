name: AQ26 Weekly Production Evidence, Website, Drive and Deploy

on:
  workflow_dispatch:
  schedule:
    # Monday 07:00 UK summer time / 06:00 UTC.
    # During GMT this runs at 06:00 UK; adjust to "0 7 * * 1" in winter if you need exact civil time.
    - cron: "0 6 * * 1"

permissions:
  contents: write
  actions: read

concurrency:
  group: aq26-weekly-production
  cancel-in-progress: false

jobs:
  weekly-production:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Europe/London
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync zip unzip jq

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt || true
          fi
          pip install pandas numpy matplotlib requests pyyaml jinja2 beautifulsoup4 lxml openpyxl || true

      - name: Show run context
        run: |
          set -euo pipefail
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: ${GITHUB_REF_NAME:-unknown}"
          echo "Run ID: $GITHUB_RUN_ID"
          date
          git status --short

      - name: Build AQ26 weekly production evidence and websites
        run: |
          set -euo pipefail

          mkdir -p outputs/aq26_production
          mkdir -p site_public/downloads
          mkdir -p site_unredacted/downloads

          echo "Starting AQ26 production build..."

          if [ -f scripts/aq26_weekly_production.py ]; then
            echo "Using scripts/aq26_weekly_production.py"
            python scripts/aq26_weekly_production.py
          elif [ -f scripts/aq26_production_build.py ]; then
            echo "Using scripts/aq26_production_build.py"
            python scripts/aq26_production_build.py
          elif [ -f scripts/aq26_weeklyv2_collect.py ] && [ -f scripts/aq26_weeklyv2_build_report.py ]; then
            echo "Using weekly v2 collect/build scripts"
            python scripts/aq26_weeklyv2_collect.py
            python scripts/aq26_weeklyv2_build_report.py
          elif [ -f Makefile ] && grep -q '^weekly-production:' Makefile; then
            echo "Using Makefile weekly-production target"
            make weekly-production
          elif [ -f Makefile ] && grep -q '^weekly:' Makefile; then
            echo "Using Makefile weekly target"
            make weekly
          else
            echo "No recognised AQ26 production builder script found."
            echo "Creating minimal safety notices so the website download area is not broken."
            cat > site_public/downloads/FULL_EVIDENCE_BUNDLE_NOTICE.txt <<'NOTICE'
AQ26 evidence bundle notice

The full weekly evidence bundle was not generated by this workflow run because no recognised AQ26 production builder script was found.
Check the repository scripts and workflow build step.
NOTICE
            cp site_public/downloads/FULL_EVIDENCE_BUNDLE_NOTICE.txt site_unredacted/downloads/FULL_EVIDENCE_BUNDLE_NOTICE.txt
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > outputs/aq26_production/latest_run_dir.txt

      - name: Normalise evidence bundle download files
        run: |
          set -euo pipefail

          mkdir -p site_public/downloads
          mkdir -p site_unredacted/downloads

          # Large ZIP bundles are often better handled as workflow artifacts / Drive copies.
          # Remove stale tracked ZIPs from the website tree and publish a small notice instead.
          rm -f site_public/downloads/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip
          rm -f site_public/downloads/latest-evidence.zip
          rm -f site_unredacted/downloads/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip
          rm -f site_unredacted/downloads/latest-evidence.zip

          cat > site_public/downloads/FULL_EVIDENCE_BUNDLE_NOTICE.txt <<'NOTICE'
AQ26 weekly evidence bundle

The full generated evidence bundle is stored as a GitHub Actions artifact and, where configured, copied to Google Drive.
This public website publishes the verified pages, summary outputs, and this notice rather than storing large ZIP files in git.
NOTICE

          cat > site_unredacted/downloads/FULL_EVIDENCE_BUNDLE_NOTICE.txt <<'NOTICE'
AQ26 weekly evidence bundle

The full generated evidence bundle is stored as a GitHub Actions artifact and, where configured, copied to Google Drive.
The password-protected unredacted website publishes the reviewed unredacted pages and this notice rather than storing large ZIP files in git.
NOTICE

      - name: Package evidence artifact
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rm -f artifacts/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip

          # Include likely production outputs without failing if some folders do not exist.
          INCLUDE=()
          for d in outputs site_public site_unredacted reports exports derived; do
            if [ -e "$d" ]; then
              INCLUDE+=("$d")
            fi
          done

          if [ "${#INCLUDE[@]}" -gt 0 ]; then
            zip -r artifacts/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip "${INCLUDE[@]}" \
              -x '*.git*' \
              -x '*/.htpasswd' \
              -x '*/node_modules/*' \
              -x '*/__pycache__/*'
          else
            echo "No output folders found to package." > artifacts/NO_OUTPUTS_FOUND.txt
            zip -r artifacts/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip artifacts/NO_OUTPUTS_FOUND.txt
          fi

          ls -lh artifacts

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: AQ26_WEEKLY_EVIDENCE_BUNDLE
          path: artifacts/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip
          if-no-files-found: error
          retention-days: 30

      - name: Optional Google Drive upload
        if: ${{ secrets.GDRIVE_SERVICE_ACCOUNT != '' && secrets.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
import base64
import json
import os
import pathlib
import subprocess
import sys

bundle = pathlib.Path("artifacts/AQ26_WEEKLY_EVIDENCE_BUNDLE.zip")
if not bundle.exists():
    print("No evidence bundle found for Drive upload.")
    sys.exit(0)

try:
    import google.oauth2.service_account
    from googleapiclient.discovery import build
    from googleapiclient.http import MediaFileUpload
except Exception:
    subprocess.check_call([sys.executable, "-m", "pip", "install", "google-api-python-client", "google-auth"])
    import google.oauth2.service_account
    from googleapiclient.discovery import build
    from googleapiclient.http import MediaFileUpload

raw = os.environ["GDRIVE_SERVICE_ACCOUNT"]
try:
    service_account_info = json.loads(raw)
except json.JSONDecodeError:
    service_account_info = json.loads(base64.b64decode(raw).decode("utf-8"))

creds = google.oauth2.service_account.Credentials.from_service_account_info(
    service_account_info,
    scopes=["https://www.googleapis.com/auth/drive.file"],
)
service = build("drive", "v3", credentials=creds)

metadata = {
    "name": "AQ26_WEEKLY_EVIDENCE_BUNDLE.zip",
    "parents": [os.environ["GDRIVE_FOLDER_ID"]],
}
media = MediaFileUpload(str(bundle), mimetype="application/zip", resumable=True)
created = service.files().create(body=metadata, media_body=media, fields="id, name").execute()
print(f"Uploaded to Google Drive: {created}")
PY

      - name: Validate website folders
        run: |
          set -euo pipefail

          if [ -d site_public ]; then
            test -f site_public/index.html || echo "WARNING: site_public/index.html missing"
          else
            echo "WARNING: site_public folder missing"
          fi

          if [ -d site_unredacted ]; then
            test -f site_unredacted/index.html || echo "WARNING: site_unredacted/index.html missing"
          else
            echo "WARNING: site_unredacted folder missing"
          fi

          if find site_public site_unredacted site_test -name .htpasswd -print -quit 2>/dev/null | grep -q .; then
            echo ".htpasswd found inside generated site folders; refusing to commit/deploy."
            find site_public site_unredacted site_test -name .htpasswd -print 2>/dev/null
            exit 1
          fi

      - name: Commit and push weekly production outputs
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Initial git status:"
          git status --short

          # Stage all generated changes, including deleted ZIP files.
          git add -A

          if git diff --cached --quiet; then
            echo "No production output changes to commit."
          else
            git commit -m "Build AQ26 weekly production evidence and website"
          fi

          # A second pass catches files created/deleted after the first commit step.
          git add -A

          if git diff --cached --quiet; then
            echo "No remaining staged changes."
          else
            git commit -m "Clean AQ26 weekly production output state"
          fi

          # This must be clean before rebase, otherwise GitHub Actions fails with:
          # error: cannot pull with rebase: You have unstaged changes.
          echo "Pre-rebase git status:"
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree is still dirty before rebase. Refusing to continue."
            git status --short
            exit 1
          fi

          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Deploy public website to Hostinger
        if: ${{ secrets.SCCAIRQUALITY_SSH_HOST != '' && secrets.SCCAIRQUALITY_SSH_USERNAME != '' && secrets.SCCAIRQUALITY_SSH_PASSWORD != '' && secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          username: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          password: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
          port: ${{ secrets.SCCAIRQUALITY_SSH_PORT || 22 }}
          source: "site_public/*"
          target: "${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}"
          strip_components: 1
          overwrite: true
          timeout: 240s
          command_timeout: 10m

      - name: Deploy unredacted website to Hostinger
        if: ${{ secrets.SCCAIRQUALITY_SSH_HOST != '' && secrets.SCCAIRQUALITY_SSH_USERNAME != '' && secrets.SCCAIRQUALITY_SSH_PASSWORD != '' && secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR != '' && hashFiles('site_unredacted/**') != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          username: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          password: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
          port: ${{ secrets.SCCAIRQUALITY_SSH_PORT || 22 }}
          source: "site_unredacted/*"
          target: "${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}/unredacted"
          strip_components: 1
          overwrite: true
          timeout: 240s
          command_timeout: 10m

      - name: Deployment summary
        if: always()
        run: |
          set -euo pipefail
          echo "AQ26 weekly production run complete with status: ${{ job.status }}"
          echo "Artifact: AQ26_WEEKLY_EVIDENCE_BUNDLE"
