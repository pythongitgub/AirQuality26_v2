name: AQ26 Weekly Production Evidence, Website, Drive and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_to_hostinger:
        description: "Deploy public + unredacted sites to sccairquality.com"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Dry-run rsync deployment only"
        required: true
        default: true
        type: boolean
      send_email:
        description: "Email final evidence bundle/report"
        required: true
        default: false
        type: boolean
      upload_to_drive:
        description: "Upload final bundle to Google Drive. Keep false until the service account writes to a Shared Drive folder."
        required: true
        default: false
        type: boolean
      upload_full_evidence_artifact:
        description: "Upload the full evidence ZIP as a separate short-retention artifact. Leave false for normal lean runs."
        required: true
        default: false
        type: boolean
      historical_backfill_weeks:
        description: "Historical weeks to update/plan this run"
        required: true
        default: "4"
        type: string
  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: aq26-weekly-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AQ26_CONFIG: configs/aq26_production.yml
  PYTHONUNBUFFERED: "1"

  CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
  CDSE_ID: ${{ secrets.CDSE_ID }}
  CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
  CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
  CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
  EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
  EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
  EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
  EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
  METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
  MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
  MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
  OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
  OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
  PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
  WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}

  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

  AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
  SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
  SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
  SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
  SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
  SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

jobs:
  weekly-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Gate scheduled run to Monday 07:00 UK
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          if os.environ.get("GITHUB_EVENT_NAME") != "schedule":
              print("should_run=true")
              print("reason=manual")
          else:
              now = datetime.now(ZoneInfo("Europe/London"))
              ok = now.weekday() == 0 and now.hour == 7
              print("should_run=" + ("true" if ok else "false"))
              print("reason=" + now.strftime("%Y-%m-%d_%H:%M_%Z"))
          PY

      - name: Stop duplicate scheduled trigger
        if: ${{ steps.gate.outputs.should_run != 'true' }}
        shell: bash
        run: |
          echo "Skipped duplicate schedule trigger: ${{ steps.gate.outputs.reason }}"

      - name: Install dependencies
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build weekly evidence, websites, report and provenance bundle
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        env:
          AQ26_HISTORICAL_BACKFILL_WEEKS: ${{ inputs.historical_backfill_weeks }}
        run: |
          set -euo pipefail
          if [ -z "${AQ26_HISTORICAL_BACKFILL_WEEKS:-}" ]; then
            export AQ26_HISTORICAL_BACKFILL_WEEKS="4"
          fi
          python scripts/aq26_production_pipeline.py --config "$AQ26_CONFIG"

      - name: Apply SEO, legal footer, cookie banner and analytics
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          AQ26_PUBLIC_URL: https://sccairquality.com
        run: |
          set -euo pipefail
          python scripts/aq26_apply_seo_legal_analytics.py --site-root site_public --domain "${AQ26_PUBLIC_URL}" --ga-id "${GA_MEASUREMENT_ID:-}"
          if [ -d site_test ]; then
            python scripts/aq26_apply_seo_legal_analytics.py --site-root site_test --domain "${AQ26_PUBLIC_URL}/test" --ga-id "${GA_MEASUREMENT_ID:-}"
          fi

      - name: Verify SEO, legal pages, sitemap, robots and analytics hooks
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          REQUIRE_GA=""
          if [ -n "${GA_MEASUREMENT_ID:-}" ]; then REQUIRE_GA="--require-ga"; fi
          python scripts/aq26_verify_seo_legal_analytics.py --site-root site_public $REQUIRE_GA

      - name: Create deployment-only unredacted password files
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_DEPLOY="${{ inputs.deploy_to_hostinger }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then DO_DEPLOY="true"; fi
          if [ "$DO_DEPLOY" != "true" ]; then
            echo "Hostinger deploy disabled for this run; skipping auth-file creation."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y apache2-utils
          rm -f site_unredacted/.htpasswd site_public/.htpasswd
          if [ -z "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            echo "SCC_UNREDACTED_PASSWORD is not set; refusing to create weak unredacted auth."
            exit 1
          fi
          # Hostinger/Apache Basic Auth for protected /unredacted/.
          # -m creates an Apache MD5 hash, which is broadly compatible on shared hosting.
          # AuthUserFile must be an absolute server path; relative .htpasswd paths often fail on Hostinger.
          htpasswd -bcm site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          REMOTE_HTPASSWD="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}/unredacted/.htpasswd"
          cat > site_unredacted/.htaccess <<EOF
          AuthType Basic
          AuthName "AQ26 Unredacted Review"
          AuthUserFile ${REMOTE_HTPASSWD}
          Require valid-user
          Options -Indexes
          EOF
          printf 'User-agent: *\nDisallow: /\n' > site_unredacted/robots.txt
          echo "Generated unredacted .htaccess with absolute AuthUserFile path."

      - name: Catalogue visual assets and prune heavy website bundles
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aq26_asset_catalogue.py || true
          python scripts/aq26_prune_publish_folders.py --max-mb 25

      - name: Create artifact size audit
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/aq26_artifact_size_report.py \
            --root outputs \
            --root site_public \
            --root site_unredacted \
            --root site_test \
            --output-dir outputs/aq26_size_audit

      - name: Install deployment tools
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_DEPLOY="${{ inputs.deploy_to_hostinger }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then DO_DEPLOY="true"; fi
          if [ "$DO_DEPLOY" != "true" ]; then
            echo "Hostinger deploy disabled for this run; skipping deployment tools."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass rsync netcat-openbsd

      - name: Deploy public and unredacted sites to Hostinger
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_DEPLOY="${{ inputs.deploy_to_hostinger }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            DO_DEPLOY="true"
            DRY_RUN="false"
          fi
          if [ "$DO_DEPLOY" != "true" ]; then
            echo "Hostinger deploy disabled for this run."
            exit 0
          fi

          : "${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR:?AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR missing}"
          : "${SCCAIRQUALITY_SSH_HOST:?SCCAIRQUALITY_SSH_HOST missing}"
          : "${SCCAIRQUALITY_SSH_PORT:?SCCAIRQUALITY_SSH_PORT missing}"
          : "${SCCAIRQUALITY_SSH_USERNAME:?SCCAIRQUALITY_SSH_USERNAME missing}"
          : "${SCCAIRQUALITY_SSH_PASSWORD:?SCCAIRQUALITY_SSH_PASSWORD missing}"

          REMOTE_ROOT="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}"
          SSH_OPTS="-p ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=20 -o ServerAliveCountMax=3"
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"

          retry() {
            label="$1"; shift
            max_attempts="${AQ26_SSH_RETRY_ATTEMPTS:-8}"
            delay="${AQ26_SSH_RETRY_DELAY_SECONDS:-20}"
            attempt=1
            while true; do
              echo "[$label] attempt $attempt/$max_attempts"
              if "$@"; then
                echo "[$label] success"
                return 0
              fi
              rc=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "[$label] failed after $max_attempts attempts with exit code $rc"
                return "$rc"
              fi
              echo "[$label] retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          echo "Testing TCP reachability to configured SSH endpoint. Secret values remain masked."
          retry "tcp-preflight" nc -vz -w 20 "$SCCAIRQUALITY_SSH_HOST" "$SCCAIRQUALITY_SSH_PORT"
          retry "ssh-mkdir" sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "mkdir -p '$REMOTE_ROOT' '$REMOTE_ROOT/unredacted'"

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN: public -> $REMOTE_ROOT and unredacted -> $REMOTE_ROOT/unredacted"
            retry "rsync-public-dry-run" sshpass -e rsync -avzn --delete --exclude 'unredacted/***' -e "ssh $SSH_OPTS" site_public/ "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/"
            retry "rsync-unredacted-dry-run" sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/unredacted/"
          else
            retry "rsync-public-live" sshpass -e rsync -avz --delete --exclude 'unredacted/***' -e "ssh $SSH_OPTS" site_public/ "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/"
            retry "rsync-unredacted-live" sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/unredacted/"
          fi

      - name: Fix and verify remote unredacted auth files
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_DEPLOY="${{ inputs.deploy_to_hostinger }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            DO_DEPLOY="true"
            DRY_RUN="false"
          fi
          if [ "$DO_DEPLOY" != "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "Skipping remote auth verification because this was not a live deployment."
            exit 0
          fi
          : "${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR:?AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR missing}"
          : "${SCCAIRQUALITY_SSH_HOST:?SCCAIRQUALITY_SSH_HOST missing}"
          : "${SCCAIRQUALITY_SSH_PORT:?SCCAIRQUALITY_SSH_PORT missing}"
          : "${SCCAIRQUALITY_SSH_USERNAME:?SCCAIRQUALITY_SSH_USERNAME missing}"
          : "${SCCAIRQUALITY_SSH_PASSWORD:?SCCAIRQUALITY_SSH_PASSWORD missing}"
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD missing}"
          REMOTE_ROOT="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}"
          SSH_OPTS="-p ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=45"
          SCP_OPTS="-P ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=45"
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"

          # Resolve the actual absolute filesystem path on Hostinger. Secrets often contain
          # a relative path such as domains/sccairquality.com/public_html, which Apache
          # cannot use in AuthUserFile. This step rewrites .htaccess remotely using the
          # actual path returned by pwd, without embedding YAML-breaking newlines.
          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "mkdir -p '$REMOTE_ROOT/unredacted'"
          ABS_UNREDACTED="$(sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "cd '$REMOTE_ROOT/unredacted' && pwd")"
          echo "Remote absolute AuthUserFile path: $ABS_UNREDACTED/.htpasswd"

          printf '%s\n' \
            'AuthType Basic' \
            'AuthName "AQ26 Unredacted Review"' \
            "AuthUserFile $ABS_UNREDACTED/.htpasswd" \
            'Require valid-user' \
            'Options -Indexes' > /tmp/aq26_unredacted_htaccess
          printf 'User-agent: *\nDisallow: /\n' > /tmp/aq26_unredacted_robots.txt

          sshpass -e scp $SCP_OPTS /tmp/aq26_unredacted_htaccess "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/unredacted/.htaccess"
          sshpass -e scp $SCP_OPTS /tmp/aq26_unredacted_robots.txt "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/unredacted/robots.txt"
          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "set -e; chmod 644 '$REMOTE_ROOT/unredacted/.htaccess'; chmod 640 '$REMOTE_ROOT/unredacted/.htpasswd'; test -s '$REMOTE_ROOT/unredacted/.htpasswd'; grep -q 'AuthUserFile ' '$REMOTE_ROOT/unredacted/.htaccess'"
          echo "Remote unredacted auth files verified."

      - name: HTTP test unredacted Basic Auth
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_DEPLOY="${{ inputs.deploy_to_hostinger }}"
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            DO_DEPLOY="true"
            DRY_RUN="false"
          fi
          if [ "$DO_DEPLOY" != "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "Skipping HTTP auth test because this was not a live deployment."
            exit 0
          fi
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD missing}"
          url="https://sccairquality.com/unredacted/"
          noauth_code=$(curl -k -L -s -o /tmp/aq26_noauth.html -w "%{http_code}" "$url" || true)
          auth_code=$(curl -k -L -s -o /tmp/aq26_auth.html -w "%{http_code}" --user "aq26:${SCC_UNREDACTED_PASSWORD}" "$url" || true)
          echo "Unauthenticated HTTP status: $noauth_code"
          echo "Authenticated HTTP status: $auth_code"
          if [ "$noauth_code" != "401" ]; then
            echo "Warning: unauthenticated /unredacted/ did not return 401. Check whether protection is already cached or redirected."
          fi
          case "$auth_code" in
            200|301|302) echo "HTTP Basic Auth test passed." ;;
            *) echo "HTTP Basic Auth test failed. The server rejected the current SCC_UNREDACTED_PASSWORD for user aq26."; exit 1 ;;
          esac

      - name: Remove deployment-only auth files
        if: always()
        shell: bash
        run: |
          rm -f site_unredacted/.htpasswd site_public/.htpasswd

      - name: Upload safe redaction failure summary
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aq26-redaction-failure-summary
          path: outputs/aq26_production/REDACTION_FAILURE_SUMMARY.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload safe validation failure summary
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aq26-validation-failure-summary
          path: |
            outputs/aq26_production/**/AQ26_VALIDATION_FAILURE_SUMMARY.json
            outputs/aq26_production/**/AQ26_VALIDATION_QUARANTINE_SUMMARY.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare small weekly review artifact
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aq26_artifact_review aq26_artifact_full_evidence
          mkdir -p aq26_artifact_review/reports aq26_artifact_review/provenance aq26_artifact_review/site-data aq26_artifact_review/size-audit
          RUN_DIR="$(cat outputs/aq26_production/latest_run_dir.txt)"
          BUNDLE_PATH="$(cat outputs/aq26_production/latest_bundle_path.txt 2>/dev/null || true)"
          echo "Preparing small review artifact from $RUN_DIR"
          cp outputs/aq26_production/LATEST_WEEKLYV2.json aq26_artifact_review/provenance/ 2>/dev/null || true
          cp outputs/aq26_production/latest_bundle_path.txt aq26_artifact_review/provenance/ 2>/dev/null || true
          cp outputs/aq26_production/latest_run_dir.txt aq26_artifact_review/provenance/ 2>/dev/null || true
          cp "$RUN_DIR"/AQ26_WEEKLY_REPORT.* aq26_artifact_review/reports/ 2>/dev/null || true
          cp "$RUN_DIR"/AQ26_*LEDGER*.csv aq26_artifact_review/provenance/ 2>/dev/null || true
          cp "$RUN_DIR"/redaction_audit.json aq26_artifact_review/provenance/ 2>/dev/null || true
          cp "$RUN_DIR"/evidence_readiness_gates.json aq26_artifact_review/provenance/ 2>/dev/null || true
          cp "$RUN_DIR"/LATEST_WEEKLYV2.json aq26_artifact_review/provenance/LATEST_WEEKLYV2_run.json 2>/dev/null || true
          cp -r outputs/aq26_size_audit/* aq26_artifact_review/size-audit/ 2>/dev/null || true
          find site_public/data -maxdepth 3 -type f \
            \( -name '*.json' -o -name '*.csv' \) \
            ! -name '*.zip' -exec cp --parents {} aq26_artifact_review/site-data/ \; 2>/dev/null || true
          if [ -n "$BUNDLE_PATH" ] && [ -f "$BUNDLE_PATH" ]; then
            mkdir -p aq26_artifact_full_evidence
            cp "$BUNDLE_PATH" aq26_artifact_full_evidence/
            sha256sum "$BUNDLE_PATH" > aq26_artifact_full_evidence/AQ26_WEEKLY_EVIDENCE_BUNDLE.sha256.txt
          fi
          echo "Small review artifact size:"
          du -sh aq26_artifact_review || true
          echo "Optional full evidence artifact size:"
          du -sh aq26_artifact_full_evidence 2>/dev/null || true

      - name: Upload small weekly review artifact
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: aq26-weekly-review-pack
          path: aq26_artifact_review/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload optional full evidence artifact
        if: ${{ steps.gate.outputs.should_run == 'true' && inputs.upload_full_evidence_artifact == true }}
        uses: actions/upload-artifact@v7
        with:
          name: aq26-full-evidence-bundle-short-retention
          path: aq26_artifact_full_evidence/**
          if-no-files-found: error
          retention-days: 3

      - name: Skip committing generated public outputs
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping generated-output commit in production workflow."
          echo "Evidence bundles remain in GitHub Actions artifacts/email/Drive; deployed website is sent by rsync."
          rm -f site_unredacted/.htpasswd site_public/.htpasswd
          find site_public site_unredacted -type f -name '*.zip' -delete 2>/dev/null || true
          git status --short || true

      - name: Upload final ZIP to Google Drive
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_UPLOAD="${{ inputs.upload_to_drive }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then DO_UPLOAD="false"; fi
          if [ "$DO_UPLOAD" != "true" ]; then
            echo "Google Drive upload disabled for this run."
            exit 0
          fi
          python scripts/aq26_upload_to_gdrive.py --latest-path outputs/aq26_production/latest_bundle_path.txt

      - name: Email report and bundle
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          DO_EMAIL="${{ inputs.send_email }}"
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then DO_EMAIL="true"; fi
          if [ "$DO_EMAIL" != "true" ]; then
            echo "Email disabled for this run."
            exit 0
          fi
          python scripts/aq26_send_production_email.py --latest-path outputs/aq26_production/latest_bundle_path.txt