name: AQ26 Refresh Unredacted Password Only

on:
  workflow_dispatch:

jobs:
  refresh-password:
    runs-on: ubuntu-24.04
    env:
      AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
      SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
      SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
      SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
      SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
      SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2-utils sshpass curl coreutils

      - name: Build and verify local htpasswd
        run: |
          set -euo pipefail
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD missing}"
          rm -f /tmp/aq26_htpasswd
          htpasswd -bcm /tmp/aq26_htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          htpasswd -vb /tmp/aq26_htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          echo "Local htpasswd verification passed for user aq26."

      - name: Write unredacted auth files over SSH without SCP
        run: |
          set -euo pipefail
          : "${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR:?AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR missing}"
          : "${SCCAIRQUALITY_SSH_HOST:?SCCAIRQUALITY_SSH_HOST missing}"
          : "${SCCAIRQUALITY_SSH_PORT:?SCCAIRQUALITY_SSH_PORT missing}"
          : "${SCCAIRQUALITY_SSH_USERNAME:?SCCAIRQUALITY_SSH_USERNAME missing}"
          : "${SCCAIRQUALITY_SSH_PASSWORD:?SCCAIRQUALITY_SSH_PASSWORD missing}"
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"
          SSH_OPTS="-p ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=75 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ssh_retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "SSH attempt $attempt/5" >&2
              if sshpass -e ssh $SSH_OPTS "$@"; then
                return 0
              fi
              echo "SSH attempt $attempt failed; retrying after short delay" >&2
              sleep $((attempt * 12))
            done
            echo "SSH failed after 5 attempts" >&2
            return 255
          }
          REMOTE_ROOT="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}"
          REMOTE_UNRED="${REMOTE_ROOT}/unredacted"
          ssh_retry "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "mkdir -p '$REMOTE_UNRED' && rm -f '$REMOTE_UNRED/.htaccess' '$REMOTE_UNRED/.htpasswd' && cd '$REMOTE_UNRED' && pwd" > /tmp/aq26_remote_pwd.txt
          REMOTE_PWD="$(tail -n 1 /tmp/aq26_remote_pwd.txt | tr -d '\r')"
          echo "Remote unredacted directory resolved by server: $REMOTE_PWD"
          cat > /tmp/aq26_htaccess <<EOF
          AuthType Basic
          AuthName "AQ26 Unredacted Review"
          AuthBasicProvider file
          AuthUserFile ${REMOTE_PWD}/.htpasswd
          Require valid-user
          Options -Indexes
          EOF
          sed -i 's/^          //' /tmp/aq26_htaccess
          HTPASSWD_B64="$(base64 -w 0 /tmp/aq26_htpasswd)"
          HTACCESS_B64="$(base64 -w 0 /tmp/aq26_htaccess)"
          ssh_retry "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "set -e; printf '%s' '$HTPASSWD_B64' | base64 -d > '$REMOTE_UNRED/.htpasswd'; printf '%s' '$HTACCESS_B64' | base64 -d > '$REMOTE_UNRED/.htaccess'; chmod 644 '$REMOTE_UNRED/.htpasswd'; chmod 644 '$REMOTE_UNRED/.htaccess'; echo 'Remote auth files written with web-readable permissions'; ls -la '$REMOTE_UNRED/.htaccess' '$REMOTE_UNRED/.htpasswd'; echo '--- .htaccess ---'; cat '$REMOTE_UNRED/.htaccess'"

      - name: Verify remote htpasswd by downloading through SSH
        run: |
          set -euo pipefail
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"
          SSH_OPTS="-p ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=75 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          REMOTE_ROOT="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}"
          REMOTE_UNRED="${REMOTE_ROOT}/unredacted"
          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "base64 -w 0 '$REMOTE_UNRED/.htpasswd'" > /tmp/remote_htpasswd.b64
          base64 -d /tmp/remote_htpasswd.b64 > /tmp/remote_htpasswd
          htpasswd -vb /tmp/remote_htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          echo "Remote .htpasswd verifies locally with SCC_UNREDACTED_PASSWORD."

      - name: Test live HTTP Basic Auth
        run: |
          set -euo pipefail
          test_url() {
            url="$1"
            echo "===== Testing $url ====="
            unauth_code=$(curl -k -s -D /tmp/aq26_unauth_headers.txt -o /tmp/aq26_unauth.html -w "%{http_code}" "$url" || true)
            auth_code=$(curl -k -s -D /tmp/aq26_auth_headers.txt -u "aq26:${SCC_UNREDACTED_PASSWORD}" -o /tmp/aq26_auth.html -w "%{http_code}" "$url" || true)
            echo "Unauthenticated HTTP status: $unauth_code"
            echo "Authenticated HTTP status: $auth_code"
            echo "Unauthenticated WWW-Authenticate header:"
            grep -i '^www-authenticate:' /tmp/aq26_unauth_headers.txt || true
            echo "Authenticated WWW-Authenticate header, if any:"
            grep -i '^www-authenticate:' /tmp/aq26_auth_headers.txt || true
            case "$unauth_code" in 401) ;; *) echo "Expected unauthenticated status 401."; return 1 ;; esac
            case "$auth_code" in 200|301|302) echo "HTTP Basic Auth passed for $url" ;; *) echo "HTTP Basic Auth failed for $url"; return 1 ;; esac
          }
          test_url "https://sccairquality.com/unredacted/"
