name: AQ26 Test Header Logo Text Polish

on:
  workflow_dispatch:
    inputs:
      build_operational_site:
        description: "Rebuild operational public/unredacted sites before creating /test"
        required: true
        default: true
        type: boolean
      include_unredacted:
        description: "Include unredacted copy under /test/unredacted"
        required: true
        default: true
        type: boolean
      deploy_test:
        description: "Deploy /test staging site to Hostinger"
        required: true
        default: true
        type: boolean
      dry_run:
        description: "Dry-run rsync only"
        required: true
        default: true
        type: boolean
      remote_test_subdir:
        description: "Remote staging folder under public_html"
        required: true
        default: "test"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}

jobs:
  polish-test-header:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebase before generating files
        run: |
          set -euo pipefail
          git pull --rebase --autostash || true

      - name: Optional rebuild of operational sites
        if: ${{ inputs.build_operational_site }}
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_operational_dual_site.py ]; then
            python scripts/aq26_build_operational_dual_site.py --repo-root . --public-site site_public --unredacted-site site_unredacted
          fi
          rm -f site_public/.htpasswd site_unredacted/.htpasswd || true

      - name: Build /test staging website
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_test_staging_site.py ]; then
            python scripts/aq26_build_test_staging_site.py --repo-root . --site-root site_test --include-unredacted "${{ inputs.include_unredacted }}"
          else
            rm -rf site_test
            mkdir -p site_test
            cp -a site_public/. site_test/
            if [ "${{ inputs.include_unredacted }}" = "true" ]; then
              mkdir -p site_test/unredacted
              cp -a site_unredacted/. site_test/unredacted/
            fi
            python - <<'PY'
            from pathlib import Path
            banner='<div style="background:#ffd34d;color:#071a30;padding:.6rem 1rem;font-weight:900;text-align:center">TEST / STAGING COPY</div>'
            for p in Path('site_test').rglob('*.html'):
                txt=p.read_text(encoding='utf-8',errors='replace')
                if 'TEST / STAGING COPY' not in txt:
                    txt=txt.replace('<body>', '<body>'+banner, 1) if '<body>' in txt else banner+txt
                if 'noindex' not in txt.lower():
                    txt=txt.replace('</head>', '<meta name="robots" content="noindex,nofollow">\n</head>', 1)
                p.write_text(txt,encoding='utf-8')
            PY
          fi
          rm -f site_public/.htpasswd site_unredacted/.htpasswd site_test/.htpasswd site_test/unredacted/.htpasswd || true

      - name: Remove text beside header logo
        run: |
          set -euo pipefail
          python scripts/aq26_remove_header_side_text.py --roots site_test site_public site_unredacted --summary site_test/data/test_header_text_polish_summary.json --fail-if-remaining

      - name: Validate test staging website
        run: |
          set -euo pipefail
          test -f site_test/index.html
          test -f site_test/test-index.html
          test -f site_test/incinerators.html
          test -f site_test/newhaven.html
          test -f site_test/weekly-update.html
          grep -Eq "AQ26_WEEKLY_ALERT_START|aq26-alert" site_test/index.html
          grep -q "aq26-video-banner" site_test/index.html
          if grep -R "SCC NEXUS · AQ26\|SCC Nexus · AQ26" site_test/*.html site_test/unredacted/*.html 2>/dev/null; then
            echo "Header side text still present in files above"
            exit 1
          fi
          ! find site_public site_unredacted site_test -name .htpasswd -print -quit | grep -q .

      - name: Commit test staging polish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f site_public/.htpasswd site_unredacted/.htpasswd site_test/.htpasswd site_test/unredacted/.htpasswd || true
          git add scripts/aq26_remove_header_side_text.py .github/workflows/aq26_test_header_text_polish.yml docs/AQ26_TEST_HEADER_TEXT_POLISH.md site_test site_public site_unredacted || true
          git reset -- ':(glob)**/.htpasswd' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No header polish changes to commit."
          else
            git commit -m "Polish AQ26 test header logo text"
            git pull --rebase --autostash
            git push
          fi

      - name: Install deployment tools
        if: ${{ inputs.deploy_test }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy /test staging site
        if: ${{ inputs.deploy_test }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${{ inputs.remote_test_subdir }}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_test/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_test/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Upload /test staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-test-header-polish
          path: |
            site_test/
          if-no-files-found: error
