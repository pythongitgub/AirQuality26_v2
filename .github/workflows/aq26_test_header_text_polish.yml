name: AQ26 Test Header Logo Text Polish

on:
  workflow_dispatch:
    inputs:
      build_operational_site:
        description: "Rebuild operational public/unredacted site before staging"
        required: true
        default: true
        type: boolean
      include_unredacted:
        description: "Include unredacted copy under /test/unredacted/"
        required: true
        default: true
        type: boolean
      deploy_test:
        description: "Deploy test staging site to Hostinger /test/"
        required: true
        default: true
        type: boolean
      dry_run:
        description: "Dry-run rsync deployment only"
        required: true
        default: true
        type: boolean
      remote_test_subdir:
        description: "Remote staging folder under public_html"
        required: true
        default: "test"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}

jobs:
  test-header-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebase before generating
        shell: bash
        run: |
          set -euo pipefail
          git config pull.rebase true
          git fetch origin main
          git pull --rebase --autostash origin main || true

      - name: Build operational site if requested
        if: ${{ inputs.build_operational_site }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_operational_dual_site.py ]; then
            python scripts/aq26_build_operational_dual_site.py --repo-root . --public-site site_public --unredacted-site site_unredacted
          else
            echo "Operational builder not present; using existing site_public/site_unredacted."
          fi
          rm -f site_unredacted/.htpasswd site_public/.htpasswd site_test/.htpasswd site_test/unredacted/.htpasswd || true

      - name: Build /test staging site
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_test_staging_site.py ]; then
            python scripts/aq26_build_test_staging_site.py \
              --repo-root . \
              --public-site site_public \
              --unredacted-site site_unredacted \
              --test-site site_test \
              ${{ inputs.include_unredacted && '--include-unredacted' || '' }}
          else
            echo "Staging builder missing; copying manually."
            rm -rf site_test
            mkdir -p site_test
            cp -a site_public/. site_test/
            if [ "${{ inputs.include_unredacted }}" = "true" ]; then
              mkdir -p site_test/unredacted
              cp -a site_unredacted/. site_test/unredacted/ || true
            fi
          fi
          rm -f site_unredacted/.htpasswd site_public/.htpasswd site_test/.htpasswd site_test/unredacted/.htpasswd || true

      - name: Remove header side text from /test
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_remove_header_side_text.py ]; then
            python scripts/aq26_remove_header_side_text.py --site-root site_test
            if [ -d site_test/unredacted ]; then
              python scripts/aq26_remove_header_side_text.py --site-root site_test/unredacted
            fi
          else
            echo "Header-side text script missing; using inline fallback."
            python - <<'PY'
          from pathlib import Path
          import re
          for root in [Path("site_test"), Path("site_test/unredacted")]:
              if not root.exists():
                  continue
              for p in root.rglob("*.html"):
                  txt = p.read_text(encoding="utf-8", errors="replace")
                  old = txt
                  txt = re.sub(r"<span[^>]*>\s*<small>\s*SCC\s+Nexus\s*[·|&middot;]\s*AQ26\s*</small>\s*</span>", "", txt, flags=re.I)
                  txt = re.sub(r"<span[^>]*>\s*SCC\s+Nexus\s*[·|&middot;]\s*AQ26\s*</span>", "", txt, flags=re.I)
                  txt = txt.replace("SCC NEXUS · AQ26", "").replace("SCC Nexus · AQ26", "")
                  if txt != old:
                      p.write_text(txt, encoding="utf-8")
          PY
          fi

      - name: Validate /test staging site
        shell: bash
        run: |
          set -euo pipefail
          test -f site_test/index.html
          test -f site_test/incinerators.html
          test -f site_test/newhaven.html
          test -f site_test/weekly-update.html
          grep -Eq "AQ26_WEEKLY_ALERT_START|aq26-alert" site_test/index.html
          grep -q "aq26-video-banner" site_test/index.html
          ! grep -R "SCC NEXUS · AQ26\|SCC Nexus · AQ26" site_test/*.html site_test/unredacted/*.html 2>/dev/null
          ! find site_public site_unredacted site_test -name .htpasswd -print -quit | grep -q .

      - name: Commit generated /test staging files safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f site_unredacted/.htpasswd site_public/.htpasswd site_test/.htpasswd site_test/unredacted/.htpasswd || true

          git add site_test scripts/aq26_remove_header_side_text.py .github/workflows/aq26_test_header_text_polish.yml docs/AQ26_TEST_HEADER_TEXT_POLISH.md || true
          git reset -- site_unredacted/.htpasswd site_public/.htpasswd site_test/.htpasswd site_test/unredacted/.htpasswd 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No staging changes to commit."
          else
            git commit -m "Polish AQ26 test staging header text"
          fi

          # Important: use autostash because generated pages can leave unstaged timestamp/cache changes.
          git pull --rebase --autostash origin main
          git push

      - name: Install deployment tools
        if: ${{ inputs.deploy_test }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy /test staging site
        if: ${{ inputs.deploy_test }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${{ inputs.remote_test_subdir }}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_test/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_test/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Upload /test staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-test-header-text-polish
          path: site_test/
          if-no-files-found: error
