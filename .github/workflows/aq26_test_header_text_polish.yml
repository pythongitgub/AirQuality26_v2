name: AQ26 Test Header Logo Text Polish

on:
  workflow_dispatch:
    inputs:
      build_operational_site:
        description: "Rebuild operational public/unredacted site before creating /test/"
        required: true
        default: true
        type: boolean
      include_unredacted:
        description: "Include unredacted review copy under /test/unredacted/"
        required: true
        default: true
        type: boolean
      deploy_test:
        description: "Deploy staging copy to Hostinger /test/"
        required: true
        default: true
        type: boolean
      dry_run:
        description: "Dry-run rsync only"
        required: true
        default: true
        type: boolean
      remote_test_subdir:
        description: "Remote staging folder under public_html"
        required: true
        default: "test"
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}

jobs:
  polish-test-header:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync before generating
        run: |
          set -euo pipefail
          git pull --rebase --autostash || true

      - name: Build operational site
        if: ${{ inputs.build_operational_site }}
        run: |
          set -euo pipefail
          python scripts/aq26_build_operational_dual_site.py --repo-root . --public-site site_public --unredacted-site site_unredacted
          find site_public site_unredacted -name .htpasswd -delete || true

      - name: Reapply weekly alert and moving banners before staging
        run: |
          set -euo pipefail
          mkdir -p .aq26_weekly_alerts site_public/data/weekly site_unredacted/data/weekly
          cat > .aq26_weekly_alerts/backfill_status.json <<'JSON'
          {"status":"completed","note":"Staging polish rebuild reused the latest committed AQ26 focused evidence outputs."}
          JSON
          if [ -f scripts/aq26_build_weekly_alert_pages.py ]; then
            python scripts/aq26_build_weekly_alert_pages.py \
              --repo-root . \
              --public-site site_public \
              --unredacted-site site_unredacted \
              --backfill-status .aq26_weekly_alerts/backfill_status.json
          fi
          if [ -f scripts/aq26_apply_webm_banners.py ]; then
            python scripts/aq26_apply_webm_banners.py --site-root site_public --asset-source website/assets --force --summary site_public/data/weekly/webm_banner_status.json || true
            python scripts/aq26_apply_webm_banners.py --site-root site_unredacted --asset-source website/assets --force --summary site_unredacted/data/weekly/webm_banner_status.json || true
          fi
          find site_public site_unredacted -name .htpasswd -delete || true

      - name: Build /test staging copy
        run: |
          set -euo pipefail
          ARGS=(--repo-root . --public-site site_public --unredacted-site site_unredacted --test-site site_test)
          if [ "${{ inputs.include_unredacted }}" = "true" ]; then
            ARGS+=(--include-unredacted)
          fi
          python scripts/aq26_build_test_staging_site.py "${ARGS[@]}"
          find site_public site_unredacted site_test -name .htpasswd -delete || true

      - name: Remove header side text
        run: |
          set -euo pipefail
          python scripts/aq26_remove_header_side_text.py \
            --roots site_test site_test/unredacted site_public site_unredacted \
            --summary site_test/data/test_header_text_polish_summary.json

      - name: Validate /test staging site
        run: |
          set -euo pipefail
          ARGS=(--test-site site_test --summary site_test/data/test_staging_validation_summary.json)
          if [ "${{ inputs.include_unredacted }}" = "true" ]; then
            ARGS+=(--include-unredacted)
          fi
          python scripts/aq26_validate_test_staging.py "${ARGS[@]}"

      - name: Commit /test staging polish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find site_public site_unredacted site_test -name .htpasswd -delete || true
          git add site_test site_public site_unredacted scripts/aq26_remove_header_side_text.py scripts/aq26_validate_test_staging.py .github/workflows/aq26_test_header_text_polish.yml docs/AQ26_TEST_HEADER_TEXT_POLISH.md || true
          git reset -- "site_unredacted/.htpasswd" "site_public/.htpasswd" "site_test/.htpasswd" "site_test/unredacted/.htpasswd" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No /test header polish changes to commit."
          else
            git commit -m "Polish AQ26 test staging header"
            git pull --rebase --autostash
            git push
          fi

      - name: Install deployment tools
        if: ${{ inputs.deploy_test }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Deploy /test staging site
        if: ${{ inputs.deploy_test }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${{ inputs.remote_test_subdir }}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_test/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_test/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Upload /test artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-test-header-polish
          path: site_test/
          if-no-files-found: error
