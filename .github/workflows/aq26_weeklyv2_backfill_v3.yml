name: AQ26 WeeklyV2 Historical Backfill V3.2.1

on:
  workflow_dispatch:
    inputs:
      backfill_start_date:
        description: "Start date YYYY-MM-DD, or auto for next missing week"
        required: true
        default: "auto"
      backfill_end_date:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-05-25"
      backfill_limit_windows:
        description: "Number of weekly windows to process this run"
        required: true
        default: "4"
      history_weeks:
        description: "Canonical public archive length"
        required: true
        default: "104"
      strict_validation:
        description: "Fail if archive/site-data validation issues remain"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      force:
        description: "Rebuild history weeks even when immutable week files already exist"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
      newsapi_enabled:
        description: "Enable NewsAPI during historical backfill (normally false to avoid 429 errors)"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
      gdelt_enabled:
        description: "Enable throttled GDELT context during historical backfill"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      gemini_enabled:
        description: "Enable Gemini metadata summary during historical backfill"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write
  actions: read

concurrency:
  group: aq26-weeklyv2-backfill-v3
  cancel-in-progress: false

jobs:
  backfill-and-build-site-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      AQ26_BACKFILL_START_DATE: ${{ inputs.backfill_start_date }}
      AQ26_BACKFILL_END_DATE: ${{ inputs.backfill_end_date }}
      AQ26_BACKFILL_LIMIT_WINDOWS: ${{ inputs.backfill_limit_windows }}
      AQ26_HISTORY_WEEKS: ${{ inputs.history_weeks }}
      AQ26_HISTORY_END_DATE: ${{ inputs.backfill_end_date }}
      AQ26_OPENAQ_ENABLED: "true"
      AQ26_CAMS_ENABLED: "true"
      AQ26_SYNC_GOOGLE_DRIVE: "true"
      AQ26_NEWSAPI_ENABLED: ${{ inputs.newsapi_enabled }}
      AQ26_NEWSDATA_ENABLED: "false"
      AQ26_GDELT_ENABLED: ${{ inputs.gdelt_enabled }}
      AQ26_GDELT_MIN_SECONDS: "6"
      AQ26_BACKFILL_NEWS_QUERY_LIMIT: "3"
      AQ26_GEMINI_ENABLED: ${{ inputs.gemini_enabled }}
      AQ26_GEMINI_MODEL: ${{ secrets.AQ26_GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.5-flash' }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY || secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY || secrets.NEWS_DATA_IO_KEY }}
      NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY || secrets.NEWS_DATA_IO_KEY }}
      CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
      CAMS_BASE_URL: ${{ secrets.CAMS_BASE_URL }}
      CAMS_ENDPOINT: ${{ secrets.CAMS_ENDPOINT }}
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID || secrets.CDSE_ID }}
      CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET || secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || secrets.AQ26_GEMINI_MODEL || 'gemini-3.5-flash' }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
      GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
      GITHUB_SHA_VALUE: ${{ github.sha }}
      GITHUB_REF_VALUE: ${{ github.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth python-dateutil beautifulsoup4 lxml pyarrow

      - name: Validate patched collector supports date-bound backfill
        run: |
          set -euo pipefail
          python scripts/aq26_weeklyv2_collect.py --help | grep -q -- '--start-date'
          python scripts/aq26_weeklyv2_collect.py --help | grep -q -- '--end-date'
          python -m py_compile scripts/aq26_weeklyv2_collect.py scripts/aq26_weeklyv2_history_v3.py

      - name: Run controlled historical backfill batch
        run: |
          set -euo pipefail
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          python scripts/aq26_weeklyv2_history_v3.py \
            --repo-root . \
            --output-root outputs \
            --site-root site_public \
            --history-weeks "$AQ26_HISTORY_WEEKS" \
            --history-end-date "$AQ26_HISTORY_END_DATE" \
            --config configs/aq26_weekly_v2_sources.yml \
            backfill-batch \
            --backfill-start-date "$AQ26_BACKFILL_START_DATE" \
            --backfill-end-date "$AQ26_BACKFILL_END_DATE" \
            --backfill-limit-windows "$AQ26_BACKFILL_LIMIT_WINDOWS" \
            $FORCE_FLAG

      - name: Canonicalise weekly index and build chart feeds
        run: |
          set -euo pipefail
          STRICT_FLAG=""
          if [ "${{ inputs.strict_validation }}" = "true" ]; then STRICT_FLAG="--strict"; fi
          python scripts/aq26_weeklyv2_history_v3.py \
            --repo-root . \
            --output-root outputs \
            --site-root site_public \
            --history-weeks "$AQ26_HISTORY_WEEKS" \
            --history-end-date "$AQ26_HISTORY_END_DATE" \
            --config configs/aq26_weekly_v2_sources.yml \
            $STRICT_FLAG \
            build-site-data

      - name: Upload AQ26 V3.2 site-data artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weeklyv2-v321-site-data-${{ github.run_id }}
          path: |
            site_public/data/**/*.json
            site_public/assets/aq26_charts_v3.js
            site_public/data/latest_backfill_summary.json
            site_public/data/latest_live_summary.json
            outputs/10_historical_backfill/history/*.json
            outputs/99_integrity/AQ26_WEEKLYV2_SITE_V3_VALIDATION.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated history and site data back to main
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_public/data site_public/assets/aq26_charts_v3.js outputs/10_historical_backfill/history outputs/99_integrity/AQ26_WEEKLYV2_SITE_V3_VALIDATION.json || true
          git commit -m "AQ26 WeeklyV2 V3.2.1 secret aliases and auto backfill" || echo "No changes to commit"
          git push || true
