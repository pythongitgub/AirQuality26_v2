name: AQ26 WeeklyV2 Evidence Harvest

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of current/live evidence to harvest"
        required: false
        default: "14"
      sync_google_drive:
        description: "Read shared Google Drive metadata via service account"
        required: false
        default: "true"
      recursive_drive_scan:
        description: "Recursively inventory the Drive folder"
        required: false
        default: "true"
      send_email:
        description: "Email final ZIP bundle"
        required: false
        default: "true"
      openaq_enabled:
        description: "Use OpenAQ with strict throttling and low request caps"
        required: false
        default: "true"
      cams_enabled:
        description: "Use CAMS/ECMWF endpoint if configured"
        required: false
        default: "true"
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: aq26-weeklyv2-evidence
  cancel-in-progress: false

jobs:
  weeklyv2:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AQ26_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      AQ26_SYNC_GOOGLE_DRIVE: ${{ github.event.inputs.sync_google_drive || 'true' }}
      AQ26_RECURSIVE_DRIVE_SCAN: ${{ github.event.inputs.recursive_drive_scan || 'true' }}
      AQ26_OPENAQ_ENABLED: ${{ github.event.inputs.openaq_enabled || 'true' }}
      AQ26_CAMS_ENABLED: ${{ github.event.inputs.cams_enabled || 'true' }}

      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}

      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}

      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}

      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}

      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
      CAMS_BASE_URL: ${{ secrets.CAMS_BASE_URL }}

      EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
      EARTHDATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
      NASA_EARTHDATA_TOKEN: ${{ secrets.EARTH_DATA_API_KEY }}

      PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
      PURPLEAIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}

      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

      GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
      GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
      GITHUB_SHA_VALUE: ${{ github.sha }}
      GITHUB_REF_VALUE: ${{ github.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files for WeeklyV2 diagnostics
        run: |
          pwd
          test -f configs/aq26_weekly_v2_sources.yml
          test -f scripts/aq26_weeklyv2_collect.py
          test -f scripts/aq26_weeklyv2_build_report.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml reportlab google-api-python-client google-auth python-dateutil

      - name: Safe secret presence summary
        run: |
          python - <<'PY'
          import os
          for name in [
            "WAQI_TOKEN","OPENWEATHER_KEY","MET_OFFICE_API_KEY","NEWS_API_KEY","NEWS_DATA_IO_KEY",
            "OPENAQ_API_KEY","CAMS_API_KEY","CAMS_BASE_URL","CDSE_ID","CDSE_SECRET",
            "EARTH_DATA_API_KEY","PURPLE_AIR_API_KEY","SERPAPI_API_KEY","GEMINI_API_KEY","GEMINI_MODEL",
            "GDRIVE_SERVICE_ACCOUNT","GDRIVE_FOLDER_ID","SMTP_HOST","MAIL_TO"
          ]:
              v = os.getenv(name, "")
              print(f"{name}: {'SET length '+str(len(v)) if v else 'EMPTY'}")
          PY


      - name: WeeklyV2 repository tidy audit
        run: |
          python scripts/aq26_repo_tidy_audit.py --output-root outputs

      - name: WeeklyV2 controlled evidence harvest
        run: |
          python scripts/aq26_weeklyv2_collect.py \
            --config configs/aq26_weekly_v2_sources.yml \
            --output-root outputs \
            --lookback-days "$AQ26_LOOKBACK_DAYS"

      - name: WeeklyV2 redaction audit before report
        run: |
          python scripts/aq26_weeklyv2_redaction_audit.py --root outputs --fail-on-leak true

      - name: WeeklyV2 update readiness gates after redaction
        run: |
          python scripts/aq26_weeklyv2_update_gates.py --output-root outputs

      - name: WeeklyV2 build report and evidence bundle
        run: |
          python scripts/aq26_weeklyv2_build_report.py --output-root outputs

      - name: WeeklyV2 redaction audit after report
        run: |
          python scripts/aq26_weeklyv2_redaction_audit.py --root outputs --fail-on-leak true

      - name: WeeklyV2 update readiness gates after final redaction
        run: |
          python scripts/aq26_weeklyv2_update_gates.py --output-root outputs

      - name: WeeklyV2 rebuild final bundle including audit and corrected gates
        run: |
          python scripts/aq26_weeklyv2_build_report.py --output-root outputs

      - name: Upload WeeklyV2 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weeklyv2-evidence-${{ github.run_id }}
          path: |
            outputs/weeklyv2_reports/*.zip
            outputs/00_weeklyv2/LATEST_WEEKLYV2.json
            outputs/99_integrity/
            outputs/12_scoring/evidence_readiness_gates.json
            outputs/04_ground_aq_providers/openaq_safety_manifest.json
            outputs/03_news_context/news_provider_warnings.json
            outputs/09_cams/cams_readiness.json
            outputs/13_repo_tidy/
            outputs/14_ai/
            outputs/15_optional_sources/
          if-no-files-found: warn
          retention-days: 30

      - name: Send WeeklyV2 email
        if: ${{ github.event.inputs.send_email != 'false' }}
        run: |
          python scripts/aq26_weeklyv2_send_email.py --output-root outputs
