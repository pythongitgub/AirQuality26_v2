name: AQ26 NASA Earthdata Auth Smoke Test

on:
  workflow_dispatch:
    inputs:
      fail_on_auth_warning:
        description: "Fail the workflow if Earthdata secrets/auth are not ready"
        required: true
        default: true
        type: boolean
      commit_outputs:
        description: "Commit smoke-test outputs back to the repository"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  earthdata-auth-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AQ26_USER_AGENT: "AQ26 Earthdata auth smoke test contact=${{ secrets.MAIL_TO }}"
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Earthdata test requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests earthaccess

      - name: Run Earthdata auth smoke test
        run: |
          FLAGS=""
          if [ "${{ inputs.fail_on_auth_warning }}" = "true" ]; then
            FLAGS="--fail-on-auth-warning"
          fi
          python scripts/aq26_earthdata_auth_smoke_test.py \
            --repo-root . \
            --out-dir outputs/34_earthdata_auth \
            --site-dir site_public/data/providers/earthdata \
            $FLAGS

      - name: Upload Earthdata auth smoke-test artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aq26-earthdata-auth-smoke-test
          path: |
            outputs/34_earthdata_auth/**
            site_public/data/providers/earthdata/auth_smoke_*.json
          if-no-files-found: warn

      - name: Commit Earthdata auth smoke-test outputs
        if: ${{ inputs.commit_outputs && success() }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            outputs/34_earthdata_auth \
            site_public/data/providers/earthdata/auth_smoke_summary.json \
            site_public/data/providers/earthdata/auth_smoke_source_records.json \
            scripts/aq26_earthdata_auth_smoke_test.py \
            .github/workflows/aq26_earthdata_auth_smoke_test.yml
          if git diff --cached --quiet; then
            echo "No Earthdata auth smoke-test changes to commit"
          else
            git commit -m "Add AQ26 Earthdata auth smoke test"
            git push
          fi
