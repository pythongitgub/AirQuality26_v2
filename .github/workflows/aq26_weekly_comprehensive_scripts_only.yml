name: AQ26 Weekly Comprehensive Evidence Report Scripts Only

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back for live/current evidence harvesting"
        required: false
        default: "14"
      download_official_files:
        description: "Download candidate official documents under size cap"
        required: false
        default: "true"
      send_email:
        description: "Send report email"
        required: false
        default: "true"
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  weekly-evidence-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      AQ26_CONFIG: configs/aq26_weekly_sources.yml
      AQ26_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      AQ26_DOWNLOAD_OFFICIAL_FILES: ${{ github.event.inputs.download_official_files || 'true' }}
      AQ26_SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
      GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml reportlab python-dateutil

      - name: Collect live and official evidence sources
        run: |
          python scripts/aq26_collect_sources.py \
            --config "$AQ26_CONFIG" \
            --lookback-days "$AQ26_LOOKBACK_DAYS" \
            --download-official-files "$AQ26_DOWNLOAD_OFFICIAL_FILES"

      - name: Run redaction and integrity audit before report build
        run: |
          python scripts/aq26_redaction_audit.py --root outputs --fail-on-leak true

      - name: Build weekly PDF, metadata and provenance bundle
        run: |
          python scripts/aq26_build_weekly_report.py --config "$AQ26_CONFIG"

      - name: Run final redaction audit
        run: |
          python scripts/aq26_redaction_audit.py --root outputs --fail-on-leak true

      - name: Upload comprehensive report artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weekly-comprehensive-scripts-only-${{ github.run_id }}
          path: |
            outputs/weekly_reports/**
            outputs/00_live_harvest/**
            outputs/99_integrity/**
            outputs/source_history/**
          if-no-files-found: error
          retention-days: 30

      - name: Send report email
        if: ${{ env.AQ26_SEND_EMAIL == 'true' }}
        run: |
          python scripts/aq26_send_email.py
