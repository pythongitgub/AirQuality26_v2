name: AQ26 Weekly Integrated Evidence Harvest

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of current/live evidence to harvest"
        required: false
        default: "14"
      backfill_start_date:
        description: "Optional backfill start date YYYY-MM-DD. Leave blank for current weekly only."
        required: false
        default: ""
      backfill_end_date:
        description: "Optional backfill end date YYYY-MM-DD. Leave blank to use today UTC."
        required: false
        default: ""
      download_official_files:
        description: "Download official candidate files under configured size cap"
        required: false
        default: "true"
      sync_google_drive:
        description: "List/snapshot shared Google Drive evidence folder using service account"
        required: false
        default: "true"
      gdrive_folder_id:
        description: "Optional Drive folder ID. Overrides GDRIVE_FOLDER_ID secret if supplied."
        required: false
        default: ""
      send_email:
        description: "Email final ZIP bundle"
        required: false
        default: "true"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: aq26-weekly-integrated-evidence
  cancel-in-progress: false

jobs:
  integrated-weekly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AQ26_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      AQ26_BACKFILL_START_DATE: ${{ github.event.inputs.backfill_start_date || '' }}
      AQ26_BACKFILL_END_DATE: ${{ github.event.inputs.backfill_end_date || '' }}
      AQ26_DOWNLOAD_OFFICIAL_FILES: ${{ github.event.inputs.download_official_files || 'true' }}
      AQ26_SYNC_GOOGLE_DRIVE: ${{ github.event.inputs.sync_google_drive || 'true' }}
      AQ26_GDRIVE_FOLDER_ID_INPUT: ${{ github.event.inputs.gdrive_folder_id || '' }}

      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}

      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}

      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

      GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
      GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
      GITHUB_SHA_VALUE: ${{ github.sha }}
      GITHUB_REF_VALUE: ${{ github.ref }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml reportlab beautifulsoup4 python-dateutil google-api-python-client google-auth

      - name: Show safe environment summary
        run: |
          python - <<'PY'
          import os
          names = ["WAQI_TOKEN","OPENWEATHER_KEY","OW_KEY","MET_OFFICE_KEY","METOFFICE_API_KEY","NEWS_API_KEY","NEWS_DATA_IO_KEY","CDSE_ID","CDSE_SECRET","CDSE_USERNAME","CDSE_PASSWORD","GDRIVE_CREDENTIALS","GDRIVE_SERVICE_ACCOUNT_JSON","GDRIVE_SERVICE_ACCOUNT","GDRIVE_FOLDER_ID","SMTP_HOST","SMTP_USERNAME","MAIL_FROM","MAIL_TO"]
          for n in names:
              v=os.getenv(n,"")
              print(f"{n}: {'SET length '+str(len(v)) if v else 'EMPTY'}")
          PY

      - name: Harvest integrated evidence
        run: |
          python scripts/aq26_integrated_evidence_harvest.py             --config configs/aq26_integrated_sources.yml             --output-root outputs             --lookback-days "$AQ26_LOOKBACK_DAYS"             --backfill-start-date "$AQ26_BACKFILL_START_DATE"             --backfill-end-date "$AQ26_BACKFILL_END_DATE"             --download-official-files "$AQ26_DOWNLOAD_OFFICIAL_FILES"             --sync-google-drive "$AQ26_SYNC_GOOGLE_DRIVE"             --gdrive-folder-id "$AQ26_GDRIVE_FOLDER_ID_INPUT"

      - name: Scan anomalies and attention alerts
        run: |
          python scripts/aq26_anomaly_scan.py --output-root outputs

      - name: Build report bundle
        run: |
          python scripts/aq26_build_integrated_report.py --output-root outputs

      - name: Redaction audit
        run: |
          python scripts/aq26_redaction_audit.py --root outputs --fail-on-leak true

      - name: Upload integrated evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-integrated-weekly-evidence-${{ github.run_id }}
          path: |
            outputs/weekly_reports/*.zip
            outputs/00_live_harvest/LATEST_HARVEST.json
            outputs/99_integrity/redaction_audit.json
            outputs/99_integrity/AQ26_SHA256_LEDGER.csv
            outputs/source_history/source_index.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Send email
        if: ${{ github.event.inputs.send_email != 'false' }}
        run: |
          python scripts/aq26_send_email.py --output-root outputs
