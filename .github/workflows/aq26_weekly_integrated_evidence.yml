name: AQ26 Weekly Integrated Evidence Harvest

on:
  workflow_dispatch:
    inputs:
      lookback_days: {description: "Days of current/live evidence to harvest", required: false, default: "14"}
      backfill_start_date: {description: "Optional backfill start date YYYY-MM-DD", required: false, default: ""}
      backfill_end_date: {description: "Optional backfill end date YYYY-MM-DD", required: false, default: ""}
      download_official_files: {description: "Download official candidate files", required: false, default: "true"}
      sync_google_drive: {description: "Snapshot shared Google Drive folder", required: false, default: "true"}
      recursive_drive_scan: {description: "Recursively inventory shared Google Drive folder", required: false, default: "true"}
      gdrive_folder_id: {description: "Optional Drive folder ID override", required: false, default: ""}
      send_email: {description: "Email final ZIP bundle", required: false, default: "true"}
  schedule:
    - cron: "17 6 * * 1"

permissions: {contents: read, actions: read}
concurrency: {group: aq26-weekly-integrated-evidence, cancel-in-progress: false}

jobs:
  integrated-weekly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AQ26_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      AQ26_BACKFILL_START_DATE: ${{ github.event.inputs.backfill_start_date || '' }}
      AQ26_BACKFILL_END_DATE: ${{ github.event.inputs.backfill_end_date || '' }}
      AQ26_DOWNLOAD_OFFICIAL_FILES: ${{ github.event.inputs.download_official_files || 'true' }}
      AQ26_SYNC_GOOGLE_DRIVE: ${{ github.event.inputs.sync_google_drive || 'true' }}
      AQ26_RECURSIVE_DRIVE_SCAN: ${{ github.event.inputs.recursive_drive_scan || 'true' }}
      AQ26_GDRIVE_FOLDER_ID_INPUT: ${{ github.event.inputs.gdrive_folder_id || '' }}
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml reportlab beautifulsoup4 python-dateutil google-api-python-client google-auth
      - name: Harvest integrated evidence
        run: |
          python scripts/aq26_integrated_evidence_harvest.py --config configs/aq26_integrated_sources.yml --output-root outputs --lookback-days "$AQ26_LOOKBACK_DAYS" --backfill-start-date "$AQ26_BACKFILL_START_DATE" --backfill-end-date "$AQ26_BACKFILL_END_DATE" --download-official-files "$AQ26_DOWNLOAD_OFFICIAL_FILES" --sync-google-drive "$AQ26_SYNC_GOOGLE_DRIVE" --gdrive-folder-id "$AQ26_GDRIVE_FOLDER_ID_INPUT"
      - name: Recursive Google Drive evidence inventory
        if: ${{ github.event.inputs.recursive_drive_scan != 'false' }}
        run: |
          python scripts/aq26_drive_recursive_inventory.py --output-root outputs --folder-id "$AQ26_GDRIVE_FOLDER_ID_INPUT" --max-files 5000 --max-depth 7
      - name: Build missing-date and evidence-gap backfill plan
        run: |
          python scripts/aq26_backfill_gap_planner.py --output-root outputs --lookback-days "$AQ26_LOOKBACK_DAYS" --backfill-start-date "$AQ26_BACKFILL_START_DATE" --backfill-end-date "$AQ26_BACKFILL_END_DATE"
      - name: Score official filings, source relevance and alerts
        run: python scripts/aq26_evidence_scoring.py --output-root outputs
      - name: Scan anomalies and attention alerts
        run: python scripts/aq26_anomaly_scan.py --output-root outputs
      - name: Redaction audit before report bundle
        run: python scripts/aq26_redaction_audit.py --root outputs --fail-on-leak true
      - name: Build final report bundle
        run: python scripts/aq26_build_integrated_report.py --output-root outputs
      - name: Redaction audit after report bundle
        run: python scripts/aq26_redaction_audit.py --root outputs --fail-on-leak true
      - name: Rebuild final report bundle including redaction audit
        run: python scripts/aq26_build_integrated_report.py --output-root outputs
      - name: Upload integrated evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-integrated-weekly-evidence-${{ github.run_id }}
          path: |
            outputs/weekly_reports/*.zip
            outputs/00_live_harvest/LATEST_HARVEST.json
            outputs/99_integrity/redaction_audit.json
            outputs/99_integrity/AQ26_SHA256_LEDGER.csv
            outputs/99_integrity/AQ26_FINAL_ZIP_LEDGER.csv
            outputs/source_history/source_index.jsonl
            outputs/08_gdrive_snapshot/
            outputs/11_backfill/
            outputs/12_scoring/
          if-no-files-found: warn
          retention-days: 30
      - name: Send email
        if: ${{ github.event.inputs.send_email != 'false' }}
        run: python scripts/aq26_send_email.py --output-root outputs
