name: AQ26 Website Quality Gate

on:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Preflight repository paths
        run: |
          set -euo pipefail
          python scripts/aq26_repo_preflight.py

      - name: Build overhauled site
        run: |
          set -euo pipefail
          python scripts/aq26_build_overhauled_site.py

      - name: Run quality gate
        run: |
          set -euo pipefail
          python scripts/aq26_site_quality_gate.py
