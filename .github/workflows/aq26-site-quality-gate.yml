name: AQ26 Website Quality Gate

on:
  workflow_dispatch:

concurrency:
  group: aq26-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install beautifulsoup4 PyYAML requests; fi
      - name: Preflight
        run: |
          set -euo pipefail
          python scripts/aq26_repo_preflight.py
      - name: Build site
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          python scripts/aq26_build_overhauled_site.py
      - name: Quality gate
        run: |
          set -euo pipefail
          python scripts/aq26_site_quality_gate.py
