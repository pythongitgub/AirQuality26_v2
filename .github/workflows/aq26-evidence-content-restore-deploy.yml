name: AQ26 Evidence Content Restore and Deploy

on:
  workflow_dispatch:

concurrency:
  group: aq26-evidence-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-content-restore-deploy:
    name: Restore evidence content and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python requirements if present
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Normalise AQ26 config path
        run: |
          set -euo pipefail
          if [ -f configs/aq26_site_config.json ] && [ ! -f config/aq26_site_config.json ]; then
            mkdir -p config
            cp configs/aq26_site_config.json config/aq26_site_config.json
            echo "Normalised config path: copied configs/aq26_site_config.json to config/aq26_site_config.json"
          fi
          if [ -f scripts/aq26_repo_preflight.py ]; then
            python scripts/aq26_repo_preflight.py
          fi

      - name: Build evidence-rich AQ26 pages
        run: |
          set -euo pipefail
          python scripts/aq26_build_evidence_content_site.py

      - name: Evidence content quality gate
        run: |
          set -euo pipefail
          python scripts/aq26_evidence_content_gate.py

      - name: Deploy public and protected sites to Hostinger
        env:
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
          AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_deploy_hostinger_dual.py ]; then
            python scripts/aq26_deploy_hostinger_dual.py
          else
            echo "scripts/aq26_deploy_hostinger_dual.py missing; build and gate passed but deploy script is unavailable."
            exit 1
          fi
