name: AQ26 Evidence Content Restore and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_strategy:
        description: "build_only, auto, ssh, or ftp"
        required: true
        default: build_only
        type: choice
        options:
          - build_only
          - auto
          - ssh
          - ftp

concurrency:
  group: aq26-evidence-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch builder nav syntax if needed
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_patch_builder_nav_syntax.py ]; then
            python scripts/aq26_patch_builder_nav_syntax.py
          else
            echo "No optional nav syntax patcher present; continuing."
          fi

      - name: Build real evidence content from repository outputs
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          AQ26_CONTACT_EMAIL: enquiries@sccairquality.com
        run: |
          set -euo pipefail
          test -f scripts/aq26_build_evidence_content.py
          python -m py_compile scripts/aq26_build_evidence_content.py
          python scripts/aq26_build_evidence_content.py

      - name: Upload built website artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-built-evidence-site
          path: |
            site_public
            site_unredacted
          retention-days: 14

      - name: Install deploy tools
        if: ${{ inputs.deploy_strategy != 'build_only' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass lftp openssh-client
          command -v sshpass
          command -v lftp

      - name: Deploy if requested
        if: ${{ inputs.deploy_strategy != 'build_only' }}
        env:
          AQ26_DEPLOY_STRATEGY: ${{ inputs.deploy_strategy }}
          SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
          SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
          SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
          SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
          AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
          AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_UNREDACTED_DIR }}
          SCCAIRQUALITY_FTP_HOST: ${{ secrets.SCCAIRQUALITY_FTP_HOST }}
          SCCAIRQUALITY_FTP_PORT: ${{ secrets.SCCAIRQUALITY_FTP_PORT }}
          SCCAIRQUALITY_FTP_USERNAME: ${{ secrets.SCCAIRQUALITY_FTP_USERNAME }}
          SCCAIRQUALITY_FTP_PASSWORD: ${{ secrets.SCCAIRQUALITY_FTP_PASSWORD }}
          SCCAIRQUALITY_FTP_PUBLIC_HTML_DIR: ${{ secrets.SCCAIRQUALITY_FTP_PUBLIC_HTML_DIR }}
          SCCAIRQUALITY_FTP_UNREDACTED_DIR: ${{ secrets.SCCAIRQUALITY_FTP_UNREDACTED_DIR }}
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_deploy_hostinger_dual.py ]; then
            python scripts/aq26_deploy_hostinger_dual.py
          else
            echo "No deploy script present; use the uploaded artifact for manual Hostinger File Manager upload."
            exit 1
          fi
