name: AQ26 Refresh Unredacted Password Only

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
  SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
  SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
  SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
  SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
  SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

jobs:
  refresh-password:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2-utils sshpass rsync

      - name: Create and upload fresh unredacted password files
        shell: bash
        run: |
          set -euo pipefail
          : "${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR:?AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR missing}"
          : "${SCCAIRQUALITY_SSH_HOST:?SCCAIRQUALITY_SSH_HOST missing}"
          : "${SCCAIRQUALITY_SSH_PORT:?SCCAIRQUALITY_SSH_PORT missing}"
          : "${SCCAIRQUALITY_SSH_USERNAME:?SCCAIRQUALITY_SSH_USERNAME missing}"
          : "${SCCAIRQUALITY_SSH_PASSWORD:?SCCAIRQUALITY_SSH_PASSWORD missing}"
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD missing}"

          REMOTE_ROOT="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}"
          SSH_OPTS="-p ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=45"
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"

          mkdir -p /tmp/aq26_auth
          htpasswd -bcm /tmp/aq26_auth/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"

          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "mkdir -p '$REMOTE_ROOT/unredacted'"
          sshpass -e scp $SSH_OPTS /tmp/aq26_auth/.htpasswd "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST:$REMOTE_ROOT/unredacted/.htpasswd"

          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "set -e; ABS_UNREDACTED=\$(cd '$REMOTE_ROOT/unredacted' && pwd); printf '%s\n' 'AuthType Basic' 'AuthName \"AQ26 Unredacted Review\"' \"AuthUserFile \$ABS_UNREDACTED/.htpasswd\" 'Require valid-user' 'Options -Indexes' > '$REMOTE_ROOT/unredacted/.htaccess'; printf 'User-agent: *\nDisallow: /\n' > '$REMOTE_ROOT/unredacted/robots.txt'; chmod 644 '$REMOTE_ROOT/unredacted/.htaccess'; chmod 640 '$REMOTE_ROOT/unredacted/.htpasswd'; test -s '$REMOTE_ROOT/unredacted/.htpasswd'; grep -q \"AuthUserFile \$ABS_UNREDACTED/.htpasswd\" '$REMOTE_ROOT/unredacted/.htaccess'; echo \"Remote absolute AuthUserFile path: \$ABS_UNREDACTED/.htpasswd\""

      - name: HTTP test unredacted Basic Auth
        shell: bash
        run: |
          set -euo pipefail
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD missing}"
          url="https://sccairquality.com/unredacted/"
          noauth_code=$(curl -k -L -s -o /tmp/aq26_noauth.html -w "%{http_code}" "$url" || true)
          auth_code=$(curl -k -L -s -o /tmp/aq26_auth.html -w "%{http_code}" --user "aq26:${SCC_UNREDACTED_PASSWORD}" "$url" || true)
          echo "Unauthenticated HTTP status: $noauth_code"
          echo "Authenticated HTTP status: $auth_code"
          if [ "$noauth_code" != "401" ]; then
            echo "Warning: unauthenticated /unredacted/ did not return 401."
          fi
          case "$auth_code" in
            200|301|302) echo "HTTP Basic Auth test passed for user aq26." ;;
            *) echo "HTTP Basic Auth test failed. The current SCC_UNREDACTED_PASSWORD was rejected."; exit 1 ;;
          esac
