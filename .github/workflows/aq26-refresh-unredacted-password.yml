name: AQ26 Refresh Unredacted Password Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-password:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
      SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
      SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
      SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
      SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}
      SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
    steps:
      - name: Install auth and SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2-utils sshpass curl

      - name: Refresh unredacted Basic Auth files without scp
        shell: bash
        run: |
          set -euo pipefail
          : "${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR:?AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR missing}"
          : "${SCCAIRQUALITY_SSH_HOST:?SCCAIRQUALITY_SSH_HOST missing}"
          : "${SCCAIRQUALITY_SSH_PORT:?SCCAIRQUALITY_SSH_PORT missing}"
          : "${SCCAIRQUALITY_SSH_USERNAME:?SCCAIRQUALITY_SSH_USERNAME missing}"
          : "${SCCAIRQUALITY_SSH_PASSWORD:?SCCAIRQUALITY_SSH_PASSWORD missing}"
          : "${SCC_UNREDACTED_PASSWORD:?SCC_UNREDACTED_PASSWORD missing}"

          REMOTE_ROOT="${AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR%/}"
          REMOTE_UNREDACTED="$REMOTE_ROOT/unredacted"
          SSH_OPTS="-p ${SCCAIRQUALITY_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=45"
          export SSHPASS="$SCCAIRQUALITY_SSH_PASSWORD"

          mkdir -p /tmp/aq26_auth
          htpasswd -bcm /tmp/aq26_auth/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"

          # Ask the remote shell for the real absolute path after mkdir/cd.
          REMOTE_ABS_UNREDACTED=$(sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "mkdir -p '$REMOTE_UNREDACTED' && cd '$REMOTE_UNREDACTED' && pwd")
          REMOTE_HTPASSWD="$REMOTE_ABS_UNREDACTED/.htpasswd"
          echo "Remote absolute AuthUserFile path: $REMOTE_HTPASSWD"

          cat > /tmp/aq26_auth/.htaccess <<EOF
          AuthType Basic
          AuthName "AQ26 Unredacted Review"
          AuthUserFile $REMOTE_HTPASSWD
          Require valid-user
          Options -Indexes
          EOF

          # Do not use scp. Stream file contents through ssh so port parsing cannot break.
          base64 -w 0 /tmp/aq26_auth/.htpasswd > /tmp/aq26_auth/htpasswd.b64
          base64 -w 0 /tmp/aq26_auth/.htaccess > /tmp/aq26_auth/htaccess.b64
          HTPASSWD_B64=$(cat /tmp/aq26_auth/htpasswd.b64)
          HTACCESS_B64=$(cat /tmp/aq26_auth/htaccess.b64)

          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "mkdir -p '$REMOTE_UNREDACTED' && printf '%s' '$HTPASSWD_B64' | base64 -d > '$REMOTE_UNREDACTED/.htpasswd' && printf '%s' '$HTACCESS_B64' | base64 -d > '$REMOTE_UNREDACTED/.htaccess' && chmod 640 '$REMOTE_UNREDACTED/.htpasswd' && chmod 644 '$REMOTE_UNREDACTED/.htaccess'"

          sshpass -e ssh $SSH_OPTS "$SCCAIRQUALITY_SSH_USERNAME@$SCCAIRQUALITY_SSH_HOST" "test -f '$REMOTE_UNREDACTED/.htpasswd' && test -f '$REMOTE_UNREDACTED/.htaccess' && grep -q 'AuthUserFile $REMOTE_HTPASSWD' '$REMOTE_UNREDACTED/.htaccess'"
          echo "Remote unredacted auth files verified."

      - name: HTTP Basic Auth smoke test
        shell: bash
        run: |
          set -euo pipefail
          unauth_code=$(curl -k -L -s -o /tmp/aq26_unauth.html -w "%{http_code}" "https://sccairquality.com/unredacted/" || true)
          auth_code=$(curl -k -L -s -u "aq26:${SCC_UNREDACTED_PASSWORD}" -o /tmp/aq26_auth.html -w "%{http_code}" "https://sccairquality.com/unredacted/" || true)
          echo "Unauthenticated HTTP status: $unauth_code"
          echo "Authenticated HTTP status: $auth_code"
          test "$unauth_code" = "401"
          case "$auth_code" in
            200|301|302) echo "HTTP Basic Auth test passed for user aq26." ;;
            *) echo "HTTP Basic Auth failed for user aq26."; exit 1 ;;
          esac
