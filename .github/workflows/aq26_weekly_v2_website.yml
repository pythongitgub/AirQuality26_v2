name: AQ26 WeeklyV2 Website Publish

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of evidence to harvest for the current weekly page"
        required: false
        default: "14"
      history_weeks:
        description: "Number of historical weekly slots to maintain on the website"
        required: false
        default: "52"
      publish_pages:
        description: "Publish to GitHub Pages branch gh-pages"
        required: false
        default: "true"
      send_email:
        description: "Email final evidence ZIP"
        required: false
        default: "true"
  schedule:
    - cron: "31 6 * * 1"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: aq26-weeklyv2-website
  cancel-in-progress: false

jobs:
  weeklyv2-website:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AQ26_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
      AQ26_HISTORY_WEEKS: ${{ github.event.inputs.history_weeks || '52' }}
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OW_KEY: ${{ secrets.OW_KEY }}
      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      CAMS_API_KEY: ${{ secrets.CAMS_API_KEY }}
      CAMS_BASE_URL: ${{ secrets.CAMS_BASE_URL }}
      EARTH_DATA_API_KEY: ${{ secrets.EARTH_DATA_API_KEY }}
      PURPLE_AIR_API_KEY: ${{ secrets.PURPLE_AIR_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
      GITHUB_REPOSITORY_VALUE: ${{ github.repository }}
      GITHUB_SHA_VALUE: ${{ github.sha }}
      GITHUB_REF_VALUE: ${{ github.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout existing GitHub Pages history if available
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: _existing_site
      - name: Restore previous AQ26 site history
        run: |
          mkdir -p outputs/website_history
          if [ -d "_existing_site/data/history" ]; then cp -R _existing_site/data/history/. outputs/website_history/ || true; fi
          if [ -f "_existing_site/data/weekly_index.json" ]; then cp _existing_site/data/weekly_index.json outputs/website_history/weekly_index.previous.json || true; fi
      - name: Validate required WeeklyV2 files
        run: |
          test -f configs/aq26_weekly_v2_sources.yml
          test -f scripts/aq26_weeklyv2_collect.py
          test -f scripts/aq26_weeklyv2_redaction_audit.py
          test -f scripts/aq26_weeklyv2_sanitize_outputs.py
          test -f scripts/aq26_weeklyv2_cdse_auth_probe.py
          test -f scripts/aq26_weeklyv2_update_gates.py
          test -f scripts/aq26_weeklyv2_build_report.py
          test -f scripts/aq26_weeklyv2_build_website.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyyaml reportlab google-api-python-client google-auth python-dateutil
      - name: WeeklyV2 controlled evidence harvest
        run: python scripts/aq26_weeklyv2_collect.py --config configs/aq26_weekly_v2_sources.yml --output-root outputs --lookback-days "$AQ26_LOOKBACK_DAYS"
      - name: WeeklyV2 CDSE dual-auth probe
        run: python scripts/aq26_weeklyv2_cdse_auth_probe.py --output-root outputs
      - name: WeeklyV2 sanitize provider outputs before redaction audit
        run: python scripts/aq26_weeklyv2_sanitize_outputs.py --root outputs
      - name: WeeklyV2 redaction audit before report
        run: python scripts/aq26_weeklyv2_redaction_audit.py --root outputs --fail-on-leak true
      - name: WeeklyV2 update readiness gates after redaction
        run: python scripts/aq26_weeklyv2_update_gates.py --output-root outputs
      - name: WeeklyV2 build evidence bundle
        run: python scripts/aq26_weeklyv2_build_report.py --output-root outputs
      - name: WeeklyV2 sanitize final report outputs
        run: python scripts/aq26_weeklyv2_sanitize_outputs.py --root outputs
      - name: WeeklyV2 redaction audit after report
        run: python scripts/aq26_weeklyv2_redaction_audit.py --root outputs --fail-on-leak true
      - name: WeeklyV2 update readiness gates after final redaction
        run: python scripts/aq26_weeklyv2_update_gates.py --output-root outputs
      - name: WeeklyV2 rebuild final bundle including audit and corrected gates
        run: python scripts/aq26_weeklyv2_build_report.py --output-root outputs
      - name: Build AQ26 website-ready static dashboard
        run: python scripts/aq26_weeklyv2_build_website.py --output-root outputs --site-root public_site --history-weeks "$AQ26_HISTORY_WEEKS"
      - name: Upload WeeklyV2 evidence and website artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weeklyv2-website-${{ github.run_id }}
          path: |
            outputs/weeklyv2_reports/*.zip
            outputs/00_weeklyv2/LATEST_WEEKLYV2.json
            outputs/99_integrity/
            public_site/
          if-no-files-found: warn
          retention-days: 30
      - name: Deploy static website to gh-pages
        if: ${{ github.event.inputs.publish_pages != 'false' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public_site
          force_orphan: false
          keep_files: false
          commit_message: "Publish AQ26 WeeklyV2 website ${{ github.run_id }}"
      - name: Send WeeklyV2 email
        if: ${{ github.event.inputs.send_email != 'false' }}
        run: python scripts/aq26_weeklyv2_send_email.py --output-root outputs
