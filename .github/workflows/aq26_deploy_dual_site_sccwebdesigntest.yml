name: AQ26 Deploy Public and Unredacted Sites

on:
  workflow_dispatch:
    inputs:
      deploy_public:
        description: "Deploy public site_public to HOSTINGER_PUBLIC_HTML_DIR"
        required: true
        default: true
        type: boolean
      deploy_unredacted:
        description: "Deploy site_unredacted to HOSTINGER_PUBLIC_HTML_DIR/unredacted"
        required: true
        default: true
        type: boolean
      remote_unredacted_subdir:
        description: "Remote subfolder for password-protected internal site"
        required: true
        default: "unredacted"
        type: string
      dry_run:
        description: "Dry run only"
        required: true
        default: true
        type: boolean
      max_index_files:
        description: "Maximum files to index into unredacted evidence browser"
        required: true
        default: "1000"
        type: string
      auth_debug:
        description: "Run safe SSH diagnostics before deploy"
        required: true
        default: true
        type: boolean
      rebuild_public:
        description: "Rebuild public pages with consistent readable template before deploy"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SSH_USER: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
  PUBLIC_HTML: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync apache2-utils

      - name: Rebuild public site with consistent readable template
        if: ${{ inputs.rebuild_public }}
        run: |
          set -euo pipefail
          python scripts/aq26_rebuild_public_site_consistent.py \
            --site-root site_public \
            --asset-source website/assets \
            --force

      - name: Validate public site exists
        run: |
          set -euo pipefail
          test -f site_public/index.html
          test -f site_public/readiness.html
          test -f site_public/comparisons.html
          test -f site_public/assets/aq26_consistent.css
          python scripts/aq26_rebuild_public_site_consistent.py --site-root site_public --validate-only

      - name: Build full unredacted site
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_unredacted_site.py ]; then
            python scripts/aq26_build_unredacted_site.py \
              --repo-root . \
              --public-site site_public \
              --output-site site_unredacted \
              --max-index-files "${{ inputs.max_index_files }}"
          else
            mkdir -p site_unredacted/assets site_unredacted/data/unredacted
            cp -r site_public/assets/* site_unredacted/assets/ 2>/dev/null || true
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQ26 Unredacted Review Area</title><link rel="stylesheet" href="assets/aq26_consistent.css"></head><body><main><section class="hero"><p class="eyebrow">Password-protected area</p><h1>AQ26 Unredacted Evidence Review</h1><p>Internal QA, provenance review and unredacted workflow outputs.</p></section></main></body></html>' > site_unredacted/index.html
          fi

      - name: Add Basic Auth and noindex files
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          if [ -z "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            echo "::error::SCC_UNREDACTED_PASSWORD is empty or unavailable."
            exit 1
          fi
          mkdir -p site_unredacted
          htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          REMOTE_DIR="${PUBLIC_HTML%/}/${{ inputs.remote_unredacted_subdir }}"
          {
            echo "DirectoryIndex index.html"
            echo "Options -Indexes"
            echo "AuthType Basic"
            echo "AuthName \"AQ26 Unredacted Review\""
            echo "AuthUserFile ${REMOTE_DIR}/.htpasswd"
            echo "Require valid-user"
            echo "<IfModule mod_headers.c>"
            echo "  Header set X-Robots-Tag \"noindex, nofollow, noarchive\""
            echo "</IfModule>"
          } > site_unredacted/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > site_unredacted/robots.txt
          test -f site_unredacted/index.html
          test -f site_unredacted/.htaccess
          test -f site_unredacted/.htpasswd

      - name: Validate required deploy secrets safely
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD PUBLIC_HTML; do
            val="${!name:-}"
            if [ -z "$val" ]; then
              echo "::error::$name is empty or unavailable."
              missing=1
            else
              echo "$name present; length=${#val}"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Safe SSH diagnostic
        if: ${{ inputs.auth_debug }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          timeout 15 bash -lc "cat < /dev/null > /dev/tcp/$SSH_HOST/$SSH_PORT" && echo "TCP reachable"
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            "$SSH_USER@$SSH_HOST" \
            "printf 'SSH_LOGIN_OK\n'; test -d '${PUBLIC_HTML%/}' && printf 'PUBLIC_HTML_OK\n' || printf 'PUBLIC_HTML_MISSING\n'"

      - name: Deploy public site
        if: ${{ inputs.deploy_public }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          REMOTE_DIR="${PUBLIC_HTML%/}"
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: public site_public/ -> $REMOTE_DIR/"
            sshpass -e rsync -avzn --checksum --delete --exclude '${{ inputs.remote_unredacted_subdir }}/***' -e "ssh $SSH_OPTS" site_public/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --checksum --delete --exclude '${{ inputs.remote_unredacted_subdir }}/***' -e "ssh $SSH_OPTS" site_public/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Deploy unredacted site
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          REMOTE_DIR="${PUBLIC_HTML%/}/${{ inputs.remote_unredacted_subdir }}"
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1"
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN: unredacted site_unredacted/ -> $REMOTE_DIR/"
            sshpass -e rsync -avzn --checksum --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --checksum --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          fi
