name: AQ26 Deploy Public and Unredacted Sites

on:
  workflow_dispatch:
    inputs:
      deploy_public:
        description: "Deploy public site to HOSTINGER_PUBLIC_HTML_DIR"
        type: boolean
        required: true
        default: true
      deploy_unredacted:
        description: "Deploy password-protected unredacted site to /unredacted"
        type: boolean
        required: true
        default: true
      dry_run:
        description: "Dry run only"
        type: boolean
        required: true
        default: true
      remote_unredacted_subdir:
        description: "Remote subfolder for protected site"
        type: string
        required: true
        default: "unredacted"
      max_index_files:
        description: "Maximum files listed on unredacted evidence page"
        type: string
        required: true
        default: "250"

permissions:
  contents: read

jobs:
  deploy-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
      SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
      SSH_USER: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
      PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sshpass rsync apache2-utils

      - name: Validate required secrets
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_PORT SSH_USER SSH_PASSWORD PUBLIC_HTML_DIR; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret/env: $v" >&2
              exit 1
            fi
          done
          if [ "${{ inputs.deploy_unredacted }}" = "true" ] && [ -z "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            echo "Missing SCC_UNREDACTED_PASSWORD" >&2
            exit 1
          fi

      - name: Build unredacted full site
        if: ${{ inputs.deploy_unredacted }}
        run: |
          python scripts/aq26_build_unredacted_site.py \
            --repo-root . \
            --public-site site_public \
            --output-site site_unredacted \
            --max-index-files "${{ inputs.max_index_files }}"

      - name: Add Basic Auth to unredacted site
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          AUTH_FILE_ABS="${PUBLIC_HTML_DIR}/${{ inputs.remote_unredacted_subdir }}/.htpasswd"
          htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          {
            echo 'DirectoryIndex index.html'
            echo 'Options -Indexes'
            echo 'AuthType Basic'
            echo 'AuthName "AQ26 Unredacted Review Area"'
            echo "AuthUserFile ${AUTH_FILE_ABS}"
            echo 'Require valid-user'
            echo 'Header set X-Robots-Tag "noindex, nofollow, noarchive"'
          } > site_unredacted/.htaccess
          test -s site_unredacted/index.html
          test -s site_unredacted/.htaccess
          test -s site_unredacted/.htpasswd

      - name: Verify SSH password login
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            "$SSH_USER@$SSH_HOST" "pwd && mkdir -p '$PUBLIC_HTML_DIR' && ls -ld '$PUBLIC_HTML_DIR'"

      - name: Deploy public site
        if: ${{ inputs.deploy_public }}
        run: |
          set -euo pipefail
          if [ ! -d site_public ]; then
            echo "site_public folder not present" >&2
            exit 1
          fi
          export SSHPASS="$SSH_PASSWORD"
          SSH_CMD="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          RSYNC_ARGS="-avz --exclude '.git' --exclude '__pycache__'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            RSYNC_ARGS="$RSYNC_ARGS --dry-run"
          fi
          echo "Deploying site_public/ to ${PUBLIC_HTML_DIR}/"
          sshpass -e rsync $RSYNC_ARGS -e "$SSH_CMD" site_public/ "$SSH_USER@$SSH_HOST:${PUBLIC_HTML_DIR}/"

      - name: Deploy unredacted site
        if: ${{ inputs.deploy_unredacted }}
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          REMOTE_DIR="${PUBLIC_HTML_DIR}/${{ inputs.remote_unredacted_subdir }}"
          SSH_CMD="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          $SSH_CMD "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          RSYNC_ARGS="-avz --exclude '.git' --exclude '__pycache__'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            RSYNC_ARGS="$RSYNC_ARGS --dry-run"
          fi
          echo "Deploying contents of site_unredacted/ to ${REMOTE_DIR}/"
          sshpass -e rsync $RSYNC_ARGS -e "$SSH_CMD" site_unredacted/ "$SSH_USER@$SSH_HOST:${REMOTE_DIR}/"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            $SSH_CMD "$SSH_USER@$SSH_HOST" "find '$REMOTE_DIR' -maxdepth 2 -type f | sed 's#^#REMOTE_FILE #' | head -80"
          fi

      - name: Deployment summary
        run: |
          echo "Public site: https://www.sccwebdesigntest.co.uk/"
          echo "Unredacted site: https://sccwebdesigntest.co.uk/${{ inputs.remote_unredacted_subdir }}/"
          echo "Dry run: ${{ inputs.dry_run }}"
