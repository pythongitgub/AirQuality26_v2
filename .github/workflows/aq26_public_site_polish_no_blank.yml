name: AQ26 Public Site Polish and No-Blank Guard

on:
  workflow_dispatch:
    inputs:
      force_public_pages:
        description: "Create/repair all core public pages even if present"
        required: true
        default: true
        type: boolean
      commit_outputs:
        description: "Commit repaired site_public outputs"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure public site has all core pages
        run: |
          set -euo pipefail
          args=""
          if [ "${{ inputs.force_public_pages }}" = "true" ]; then
            args="--force"
          fi
          python scripts/aq26_public_site_guard_build.py \
            --site-root site_public \
            --asset-source website/assets \
            $args \
            --summary outputs/public_site_guard_summary.json

      - name: Apply optional existing polish script
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_public_site_polish.py ]; then
            python scripts/aq26_public_site_polish.py \
              --site-root site_public \
              --asset-source website/assets \
              --force-comparisons \
              --force-downloads \
              --force-archive || true
          fi

      - name: Re-run guard after optional polish
        run: |
          set -euo pipefail
          python scripts/aq26_public_site_guard_build.py \
            --site-root site_public \
            --asset-source website/assets \
            --summary outputs/public_site_guard_summary.json

      - name: Commit public site guard outputs
        if: ${{ inputs.commit_outputs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add site_public outputs/public_site_guard_summary.json scripts/aq26_public_site_guard_build.py .github/workflows/aq26_public_site_polish_no_blank.yml
          if git diff --cached --quiet; then
            echo "No public site guard changes to commit"
          else
            git commit -m "Guard AQ26 public site against blank pages"
            git push
          fi
