name: AQ26 Public Site Polish and No-Blank Guard

on:
  workflow_dispatch:
    inputs:
      force_public_pages:
        description: "Create/repair all public pages before validation"
        required: true
        default: true
        type: boolean
      commit_outputs:
        description: "Commit repaired site_public outputs"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and validate public site shell
        run: |
          set -euo pipefail
          args=""
          if [ "${{ inputs.force_public_pages }}" = "true" ]; then
            args="--force-public-pages"
          fi
          python scripts/aq26_public_site_guard_build.py             --site-root site_public             --asset-source website/assets             $args             --fail-on-blank             --summary site_public/data/public_site_guard_summary.json

      - name: Commit public site guard outputs
        if: ${{ inputs.commit_outputs }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scripts/aq26_public_site_guard_build.py site_public .github/workflows/aq26_public_site_polish_no_blank.yml
          if git diff --cached --quiet; then
            echo "No public site guard changes to commit"
          else
            git commit -m "Repair AQ26 public site no-blank guard"
            git push
          fi
