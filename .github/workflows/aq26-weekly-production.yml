name: AQ26 Weekly Production Evidence, Website, Drive and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_to_hostinger:
        description: "Deploy built site folders to Hostinger"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Dry run only: build/validate but do not make live external changes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      upload_to_drive:
        description: "Upload evidence bundle to Google Drive"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      send_email:
        description: "Send completion email"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: aq26-weekly-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly-production:
    name: weekly-production
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DEPLOY_TO_HOSTINGER: ${{ github.event_name == 'schedule' && 'true' || inputs.deploy_to_hostinger }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      UPLOAD_TO_DRIVE: ${{ github.event_name == 'schedule' && 'false' || inputs.upload_to_drive }}
      SEND_EMAIL: ${{ github.event_name == 'schedule' && 'true' || inputs.send_email }}

      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}

      HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
      AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.AIRQUALITY_HOSTINGER_PUBLIC_HTML_DIR }}
      SCCAIRQUALITY_SSH_HOST: ${{ secrets.SCCAIRQUALITY_SSH_HOST }}
      SCCAIRQUALITY_SSH_PORT: ${{ secrets.SCCAIRQUALITY_SSH_PORT }}
      SCCAIRQUALITY_SSH_USERNAME: ${{ secrets.SCCAIRQUALITY_SSH_USERNAME }}
      SCCAIRQUALITY_SSH_PASSWORD: ${{ secrets.SCCAIRQUALITY_SSH_PASSWORD }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show selected run mode
        run: |
          set -euo pipefail
          echo "DEPLOY_TO_HOSTINGER=${DEPLOY_TO_HOSTINGER}"
          echo "DRY_RUN=${DRY_RUN}"
          echo "UPLOAD_TO_DRIVE=${UPLOAD_TO_DRIVE}"
          echo "SEND_EMAIL=${SEND_EMAIL}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          python -m pip install "reportlab>=4.2.0"

      - name: Prepare output folders
        run: |
          set -euo pipefail
          mkdir -p outputs/evidence outputs/logs
          mkdir -p site_public site_unredacted site_test
          mkdir -p site_public/downloads site_unredacted/downloads site_test/downloads
          mkdir -p site_public/data/weekly site_unredacted/data/weekly site_test/data/weekly

      - name: Build weekly website
        run: |
          set -euo pipefail
          python scripts/aq26_build_weekly_site.py \
            --config configs/aq26_weekly_runtime.yml \
            --manifest configs/aq26_site_manifest.yml

      - name: Build evidence bundle
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_make_evidence_bundle.py ]; then
            python scripts/aq26_make_evidence_bundle.py \
              --config configs/aq26_weekly_runtime.yml
          else
            echo "scripts/aq26_make_evidence_bundle.py not found; skipping."
          fi

      - name: Validate weekly outputs
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_validate_outputs.py ]; then
            python scripts/aq26_validate_outputs.py \
              --config configs/aq26_weekly_runtime.yml \
              --manifest configs/aq26_site_manifest.yml
          else
            echo "scripts/aq26_validate_outputs.py not found; skipping."
          fi

      - name: Upload evidence bundle to Google Drive
        if: env.UPLOAD_TO_DRIVE == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f scripts/aq26_upload_to_drive.py ]; then
            echo "scripts/aq26_upload_to_drive.py not found; skipping Drive upload."
            exit 0
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            python scripts/aq26_upload_to_drive.py \
              --config configs/aq26_weekly_runtime.yml \
              --dry-run
          else
            python scripts/aq26_upload_to_drive.py \
              --config configs/aq26_weekly_runtime.yml
          fi

      - name: Deploy site to Hostinger
        if: env.DEPLOY_TO_HOSTINGER == 'true'
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            python scripts/aq26_deploy_hostinger.py \
              --config configs/aq26_weekly_runtime.yml \
              --manifest configs/aq26_site_manifest.yml \
              --dry-run
          else
            python scripts/aq26_deploy_hostinger.py \
              --config configs/aq26_weekly_runtime.yml \
              --manifest configs/aq26_site_manifest.yml
          fi

      - name: Send completion email
        if: env.SEND_EMAIL == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN=true; skipping live email send."
            exit 0
          fi
          if [ -f scripts/aq26_send_email.py ]; then
            python scripts/aq26_send_email.py \
              --config configs/aq26_weekly_runtime.yml
          else
            echo "scripts/aq26_send_email.py not found; skipping."
          fi

      - name: Upload GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weekly-production-output
          path: |
            outputs/**
            site_public/**
            site_unredacted/**
            site_test/**
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6

      - name: Commit generated weekly operational files
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Skipping generated output commit."
          echo "Weekly outputs are deployed to Hostinger and stored as GitHub Actions artifacts."
          echo "Large ZIP/PDF evidence bundles must not be committed to the repo."
