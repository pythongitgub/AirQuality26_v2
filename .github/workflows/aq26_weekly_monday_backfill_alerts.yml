name: AQ26 Weekly Monday Backfill Alerts and Deploy

on:
  workflow_dispatch:
    inputs:
      run_backfill:
        description: "Run focused weekly backfill before building alerts"
        required: true
        default: true
        type: boolean
      backfill_windows:
        description: "Number of weekly windows to backfill/update"
        required: true
        default: "1"
        type: string
      build_operational_site:
        description: "Build operational public and unredacted site before alerts"
        required: true
        default: true
        type: boolean
      apply_alerts:
        description: "Build and inject weekly alert pages/panels"
        required: true
        default: true
        type: boolean
      deploy_public:
        description: "Deploy public site to Hostinger root"
        required: true
        default: false
        type: boolean
      deploy_unredacted:
        description: "Deploy unredacted site to /unredacted/"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Dry-run rsync deployment only"
        required: true
        default: true
        type: boolean
      remote_unredacted_subdir:
        description: "Remote protected folder under public_html"
        required: true
        default: "unredacted"
        type: string

  schedule:
    - cron: "0 6 * * 1"
    - cron: "0 7 * * 1"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}
  SCCNEXUS_SSH_HOST: ${{ secrets.SCCNEXUS_SSH_HOST }}
  SCCNEXUS_SSH_PORT: ${{ secrets.SCCNEXUS_SSH_PORT }}
  SCCNEXUS_SSH_USERNAME: ${{ secrets.SCCNEXUS_SSH_USERNAME }}
  SCCNEXUS_SSH_PASSWORD: ${{ secrets.SCCNEXUS_SSH_PASSWORD }}
  SCC_UNREDACTED_PASSWORD: ${{ secrets.SCC_UNREDACTED_PASSWORD }}
  OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
  WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
  METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
  MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
  OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
  GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}

jobs:
  weekly-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate scheduled Monday 7am UK run
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          if event != "schedule":
              print("should_run=true")
              print("gate_reason=manual_dispatch")
          else:
              now = datetime.now(ZoneInfo("Europe/London"))
              ok = now.weekday() == 0 and now.hour == 7
              print(f"should_run={'true' if ok else 'false'}")
              print(f"gate_reason=uk_time_{now:%Y-%m-%d_%H:%M_%Z}")
          PY

      - name: Skip duplicate schedule trigger
        if: ${{ steps.gate.outputs.should_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Skipping duplicate schedule trigger"
          echo "Gate reason: ${{ steps.gate.outputs.gate_reason }}"

      - name: Ensure weekly directories exist
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site_public/data/weekly site_unredacted/data/weekly
          mkdir -p site_public/assets site_unredacted/assets
          mkdir -p site_public/downloads site_unredacted/downloads
          mkdir -p outputs/weekly_alerts .aq26_weekly_alerts

      - name: Attempt focused weekly backfill
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.run_backfill) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site_public/data/weekly site_unredacted/data/weekly outputs/weekly_alerts .aq26_weekly_alerts
          cat > .aq26_weekly_alerts/backfill_status.json <<'JSON'
          {"status":"not_run","note":"No recognised backfill script was found in this repository checkout."}
          JSON
          if [ -f scripts/aq26_weeklyv2_science_backfill_v331.py ]; then
            if python scripts/aq26_weeklyv2_science_backfill_v331.py --history-weeks "${{ inputs.backfill_windows }}"; then
              echo '{"status":"attempted","script":"scripts/aq26_weeklyv2_science_backfill_v331.py"}' > .aq26_weekly_alerts/backfill_status.json
            else
              echo '{"status":"completed_with_script_warnings","script":"scripts/aq26_weeklyv2_science_backfill_v331.py","note":"Script returned non-zero; alert workflow continued."}' > .aq26_weekly_alerts/backfill_status.json
            fi
          elif [ -f scripts/aq26_weeklyv2_collect.py ]; then
            if python scripts/aq26_weeklyv2_collect.py; then
              echo '{"status":"attempted","script":"scripts/aq26_weeklyv2_collect.py"}' > .aq26_weekly_alerts/backfill_status.json
            else
              echo '{"status":"completed_with_script_warnings","script":"scripts/aq26_weeklyv2_collect.py","note":"Script returned non-zero; alert workflow continued."}' > .aq26_weekly_alerts/backfill_status.json
            fi
          else
            echo "No recognised weekly backfill script found; continuing to build alert pages from current committed evidence."
          fi
          cp .aq26_weekly_alerts/backfill_status.json site_public/data/weekly/backfill_status.json
          cp .aq26_weekly_alerts/backfill_status.json site_unredacted/data/weekly/backfill_status.json

      - name: Build operational site shell
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.build_operational_site) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_build_operational_dual_site.py ]; then
            python scripts/aq26_build_operational_dual_site.py --repo-root . --public-site site_public --unredacted-site site_unredacted
          else
            echo "Operational site builder missing; continuing with existing site_public/site_unredacted files."
          fi
          mkdir -p site_public/data/weekly site_unredacted/data/weekly
          if [ -f .aq26_weekly_alerts/backfill_status.json ]; then
            cp .aq26_weekly_alerts/backfill_status.json site_public/data/weekly/backfill_status.json
            cp .aq26_weekly_alerts/backfill_status.json site_unredacted/data/weekly/backfill_status.json
          fi

      - name: Build weekly alert pages and inject front-page alerts
        if: ${{ steps.gate.outputs.should_run == 'true' && (github.event_name == 'schedule' || inputs.apply_alerts) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site_public/data/weekly site_unredacted/data/weekly
          python scripts/aq26_build_weekly_alert_pages.py \
            --repo-root . \
            --public-site site_public \
            --unredacted-site site_unredacted \
            --backfill-status .aq26_weekly_alerts/backfill_status.json

      - name: Apply WEBM banners after build
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/aq26_apply_webm_banners.py ]; then
            python scripts/aq26_apply_webm_banners.py --site-root site_public --asset-source website/assets --force --summary site_public/data/weekly/webm_banner_status.json || true
            python scripts/aq26_apply_webm_banners.py --site-root site_unredacted --asset-source website/assets --force --summary site_unredacted/data/weekly/webm_banner_status.json || true
          else
            echo "WEBM banner applicator not present; weekly alert builder already copied banner assets where available."
          fi

      - name: Create unredacted password file
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site_unredacted
          sudo apt-get update
          sudo apt-get install -y apache2-utils
          if [ -n "${SCC_UNREDACTED_PASSWORD:-}" ]; then
            htpasswd -bc site_unredacted/.htpasswd aq26 "$SCC_UNREDACTED_PASSWORD"
          else
            echo 'aq26:disabled' > site_unredacted/.htpasswd
          fi
          cat > site_unredacted/.htaccess <<'EOF'
          AuthType Basic
          AuthName "AQ26 Unredacted Review"
          AuthUserFile .htpasswd
          Require valid-user
          EOF
          echo 'User-agent: *' > site_unredacted/robots.txt
          echo 'Disallow: /' >> site_unredacted/robots.txt

      - name: Validate generated weekly alert outputs
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f site_public/index.html
          test -f site_public/weekly-update.html
          test -f site_public/data/weekly/latest_alert.json
          test -f site_unredacted/index.html
          test -f site_unredacted/weekly-update.html
          test -f site_unredacted/data/weekly/latest_alert_unredacted.json
          grep -q "aq26-weekly-alert\|aq26-alert" site_public/index.html
          grep -q "aq26-weekly-alert\|aq26-alert" site_unredacted/index.html
          grep -q "aq26-video-banner" site_public/index.html
          grep -q "assets/favicon.svg" site_public/index.html

      - name: Commit weekly alert outputs
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_public site_unredacted .aq26_weekly_alerts || true
          if git diff --cached --quiet; then
            echo "No weekly alert output changes to commit."
          else
            git commit -m "Build AQ26 weekly Monday alert pages"
            git pull --rebase
            git push
          fi

      - name: Install deployment tools
        if: ${{ steps.gate.outputs.should_run == 'true' && (inputs.deploy_public || inputs.deploy_unredacted) }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync apache2-utils

      - name: Deploy public site
        if: ${{ steps.gate.outputs.should_run == 'true' && inputs.deploy_public }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete --exclude '${{ inputs.remote_unredacted_subdir }}/***' -e "ssh $SSH_OPTS" site_public/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete --exclude '${{ inputs.remote_unredacted_subdir }}/***' -e "ssh $SSH_OPTS" site_public/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Deploy unredacted site
        if: ${{ steps.gate.outputs.should_run == 'true' && inputs.deploy_unredacted }}
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_DIR="${HOSTINGER_PUBLIC_HTML_DIR%/}/${{ inputs.remote_unredacted_subdir }}"
          SSH_OPTS="-p ${SCCNEXUS_SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          export SSHPASS="$SCCNEXUS_SSH_PASSWORD"
          sshpass -e ssh $SSH_OPTS "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            sshpass -e rsync -avzn --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          else
            sshpass -e rsync -avz --delete -e "ssh $SSH_OPTS" site_unredacted/ "$SCCNEXUS_SSH_USERNAME@$SCCNEXUS_SSH_HOST:$REMOTE_DIR/"
          fi

      - name: Upload weekly alert artifact
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weekly-monday-alerts
          path: |
            site_public/
            site_unredacted/
            .aq26_weekly_alerts/
          if-no-files-found: error
