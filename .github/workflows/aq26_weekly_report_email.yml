name: AQ26 Weekly Comprehensive Report and Email

on:
  workflow_dispatch:
    inputs:
      notebook_glob:
        description: "Comma-separated notebook globs to execute"
        required: true
        default: "notebooks/01*.ipynb,notebooks/02*.ipynb,notebooks/03*.ipynb,notebooks/04*.ipynb,notebooks/05*.ipynb,notebooks/06*.ipynb,notebooks/07*.ipynb,notebooks/08*.ipynb,notebooks/09*.ipynb,notebooks/10*.ipynb,notebooks/30*.ipynb,notebooks/31*.ipynb,notebooks/32*.ipynb,notebooks/33*.ipynb,notebooks/34*.ipynb,notebooks/50*.ipynb,notebooks/51*.ipynb,notebooks/52*.ipynb,notebooks/53*.ipynb,notebooks/54*.ipynb,notebooks/55*.ipynb,notebooks/56*.ipynb,notebooks/57*.ipynb,notebooks/58*.ipynb,notebooks/59*.ipynb,notebooks/60*.ipynb,notebooks/61*.ipynb,notebooks/62*.ipynb,notebooks/63*.ipynb,notebooks/64*.ipynb,notebooks/65*.ipynb,notebooks/66*.ipynb,notebooks/67*.ipynb"
      continue_on_error:
        description: "Continue if a notebook fails"
        required: true
        default: "true"
      harvest_lookback_days:
        description: "Days of live/current evidence to search"
        required: true
        default: "14"
      download_official_files:
        description: "Download official linked PDFs/CSVs/XLSX/DOCX within safety cap"
        required: true
        default: "true"
      send_email:
        description: "Send SMTP email after bundle creation"
        required: true
        default: "true"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: aq26-weekly-comprehensive-report
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      AQ26_RUN_CONTEXT: github_weekly_comprehensive
      PYTHONUNBUFFERED: "1"

      # Air quality / weather / news / satellite secrets. Missing secrets are handled as EMPTY and recorded redacted in manifests.
      OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      AIRQUALITY: ${{ secrets.AIRQUALITY }}
      IQ_AIR_QUALITY_KEY: ${{ secrets.IQ_AIR_QUALITY_KEY }}
      GETAMBEE_AIR_QUALITY_KEY: ${{ secrets.GETAMBEE_AIR_QUALITY_KEY }}

      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
      NEWSDATA_IO_KEY: ${{ secrets.NEWSDATA_IO_KEY }}
      NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}

      MET_OFFICE_KEY: ${{ secrets.MET_OFFICE_KEY }}
      METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
      MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
      METOFFICE_LAND_OBSERVATIONS: ${{ secrets.METOFFICE_LAND_OBSERVATIONS }}

      CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
      CDSE_USER: ${{ secrets.CDSE_USER }}
      CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
      CDSE_ID: ${{ secrets.CDSE_ID }}
      CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
      SH_CLIENT_ID: ${{ secrets.SH_CLIENT_ID }}
      SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}

      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pyyaml pandas numpy pyarrow nbformat nbconvert jupyter ipykernel reportlab beautifulsoup4 python-dateutil
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Create output folders
        run: |
          mkdir -p outputs outputs/weekly_reports outputs/00_live_harvest outputs/source_history

      - name: Harvest live/current evidence sources
        run: |
          python scripts/aq26_live_preflight_harvest.py \
            --config configs/aq26_live_harvest.yml \
            --output-root outputs \
            --lookback-days "${{ github.event.inputs.harvest_lookback_days || '14' }}" \
            --download-official-files "${{ github.event.inputs.download_official_files || 'true' }}"

      - name: Run notebooks and build comprehensive report bundle
        run: |
          python scripts/aq26_weekly_autorun.py \
            --config configs/aq26_weekly_report.yml \
            --notebook-glob "${{ github.event.inputs.notebook_glob || 'notebooks/01*.ipynb,notebooks/02*.ipynb,notebooks/03*.ipynb,notebooks/04*.ipynb,notebooks/05*.ipynb,notebooks/06*.ipynb,notebooks/07*.ipynb,notebooks/08*.ipynb,notebooks/09*.ipynb,notebooks/10*.ipynb,notebooks/30*.ipynb,notebooks/31*.ipynb,notebooks/32*.ipynb,notebooks/33*.ipynb,notebooks/34*.ipynb,notebooks/50*.ipynb,notebooks/51*.ipynb,notebooks/52*.ipynb,notebooks/53*.ipynb,notebooks/54*.ipynb,notebooks/55*.ipynb,notebooks/56*.ipynb,notebooks/57*.ipynb,notebooks/58*.ipynb,notebooks/59*.ipynb,notebooks/60*.ipynb,notebooks/61*.ipynb,notebooks/62*.ipynb,notebooks/63*.ipynb,notebooks/64*.ipynb,notebooks/65*.ipynb,notebooks/66*.ipynb,notebooks/67*.ipynb' }}" \
            --continue-on-error "${{ github.event.inputs.continue_on_error || 'true' }}" \
            --output-root outputs/weekly_reports \
            --include-live-harvest outputs/00_live_harvest/LATEST_HARVEST.json

      - name: Upload live harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aq26-live-current-harvest-${{ github.run_id }}
          path: |
            outputs/00_live_harvest/**
            outputs/03_news_context/**
            outputs/04_ground_aq_providers/**
            outputs/05_metoffice_datahub_weather/**
            outputs/06_official_filings/**
            outputs/07_satellite_cdse/**
            outputs/source_history/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload comprehensive report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weekly-comprehensive-report-${{ github.run_id }}
          path: |
            outputs/weekly_reports/**
          if-no-files-found: error
          retention-days: 30

      - name: Email comprehensive report bundle
        if: ${{ always() && (github.event.inputs.send_email == 'true' || github.event_name == 'schedule') }}
        run: |
          python scripts/aq26_email_report.py \
            --latest-run-root outputs/weekly_reports \
            --require-attachment true \
            --max-attachment-mb 24
