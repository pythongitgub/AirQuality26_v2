name: AQ26 Weekly Validated Report and Email

on:
  workflow_dispatch:
    inputs:
      notebook_glob:
        description: "Notebook glob(s), comma separated"
        required: false
        default: "notebooks/50*.ipynb,notebooks/51*.ipynb,notebooks/52*.ipynb,notebooks/53*.ipynb,notebooks/54*.ipynb,notebooks/55*.ipynb,notebooks/56*.ipynb,notebooks/57*.ipynb,notebooks/58*.ipynb,notebooks/59*.ipynb,notebooks/60*.ipynb"
      continue_on_error:
        description: "Continue running later notebooks if one fails"
        required: false
        default: "true"
  schedule:
    # 06:15 UTC every Monday. During UK summer this is 07:15 BST.
    - cron: "15 6 * * 1"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  AQ26_RUN_MODE: "github_actions_weekly"
  AQ26_CONFIG: "configs/aq26_weekly_report.yml"
  AQ26_OUTPUT_ROOT: "outputs/weekly_reports"
  AQ26_TIMEZONE: "Europe/London"

  # Existing repository secrets observed/used across the project. Values are never printed.
  CDSE_ID: ${{ secrets.CDSE_ID }}
  CDSE_SECRET: ${{ secrets.CDSE_SECRET }}
  CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
  CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
  METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
  MET_OFFICE_API_KEY: ${{ secrets.MET_OFFICE_API_KEY }}
  MET_OFFICE_LAND_OBSERVATIONS: ${{ secrets.MET_OFFICE_LAND_OBSERVATIONS }}
  NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
  NEWS_DATA_IO_KEY: ${{ secrets.NEWS_DATA_IO_KEY }}
  OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
  WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}

  # Add these repository secrets for email delivery.
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}
  MAIL_TO: ${{ secrets.MAIL_TO }}

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install nbformat nbconvert nbclient ipykernel jupyter pandas numpy pyyaml matplotlib requests tabulate beautifulsoup4 lxml
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Patch known 52J missing zipfile import if present
        run: |
          python scripts/patch_52j_missing_zipfile.py --root . || true

      - name: Execute AQ26 notebooks and build release bundle
        id: autorun
        run: |
          NOTEBOOK_GLOB="${{ github.event.inputs.notebook_glob }}"
          if [ -z "$NOTEBOOK_GLOB" ]; then NOTEBOOK_GLOB="notebooks/50*.ipynb,notebooks/51*.ipynb,notebooks/52*.ipynb,notebooks/53*.ipynb,notebooks/54*.ipynb,notebooks/55*.ipynb,notebooks/56*.ipynb,notebooks/57*.ipynb,notebooks/58*.ipynb,notebooks/59*.ipynb,notebooks/60*.ipynb"; fi
          CONTINUE_ON_ERROR="${{ github.event.inputs.continue_on_error }}"
          if [ -z "$CONTINUE_ON_ERROR" ]; then CONTINUE_ON_ERROR="true"; fi
          python scripts/aq26_weekly_autorun.py \
            --config configs/aq26_weekly_report.yml \
            --notebook-glob "$NOTEBOOK_GLOB" \
            --continue-on-error "$CONTINUE_ON_ERROR" \
            --output-root outputs/weekly_reports

      - name: Upload complete report bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: aq26-weekly-validated-report-${{ github.run_id }}
          path: outputs/weekly_reports/**
          retention-days: 90

      - name: Email report bundle
        run: |
          python scripts/aq26_email_report.py --latest-run-root outputs/weekly_reports --require-attachment true
