project_name: "SCCNEXUS AirQuality26"
timezone: "Europe/London"
lookback_days_default: 14
output_root: "outputs"
controlled_use_boundary: |
  This is an automated evidence-harvest and controlled-review bundle for independent scrutiny.
  It is not a claim of endorsement by WHO, UNEP, EEA, C40 Cities, or any named expert.
  Causal attribution must remain guarded unless source-apportionment, meteorology, controls and QA support it.

aoi:
  name: "Newhaven Energy Recovery Facility"
  permit_hint: "BV8067IL"
  lat: 50.796
  lon: 0.055
  bbox: [-0.15, 50.68, 0.35, 50.95]  # west, south, east, north
  country: "GB"

sites:
  - id: "newhaven_incinerator"
    label: "Newhaven incinerator vicinity"
    lat: 50.796
    lon: 0.055
    role: "target"
  - id: "lewes"
    label: "Lewes control"
    lat: 50.873
    lon: 0.008
    role: "control"
  - id: "eastbourne"
    label: "Eastbourne control"
    lat: 50.768
    lon: 0.290
    role: "control"
  - id: "brighton"
    label: "Brighton urban context"
    lat: 50.822
    lon: -0.137
    role: "urban_context"
  - id: "seaford_control"
    label: "Seaford coastal control"
    lat: 50.772
    lon: 0.102
    role: "control"

search_terms:
  - "Newhaven incinerator emissions"
  - "Newhaven Energy Recovery Facility Veolia"
  - "Veolia Newhaven annual monitoring report"
  - "BV8067IL Newhaven"
  - "Newhaven Energy Recovery Facility permit"
  - "Newhaven ERF Environment Agency"
  - "Newhaven incinerator air quality"
  - "Energy Recovery Facility annual monitoring report Environment Agency"
  - "incinerator annual monitoring report data.gov.uk"
  - "UK Pollutant Release Transfer Register Newhaven"

official_watch_urls:
  - "https://www.gov.uk/search/all?keywords=Newhaven+Energy+Recovery+Facility"
  - "https://www.gov.uk/search/all?keywords=BV8067IL"
  - "https://www.gov.uk/guidance/uk-pollutant-release-and-transfer-register-prtr-data-sets"
  - "https://www.data.gov.uk/search?q=incinerator+annual+monitoring+report"
  - "https://www.veolia.co.uk/southdowns/facilities/newhaven-erf"

satellite:
  stac_url: "https://catalogue.dataspace.copernicus.eu/stac/search"
  odata_url: "https://catalogue.dataspace.copernicus.eu/odata/v1/Products"
  collections:
    - "SENTINEL-5P"
  products:
    - "L2__NO2___"
    - "L2__SO2___"
    - "L2__CO____"
    - "L2__HCHO__"
    - "L2__O3____"
    - "L2__AER_AI"
  fallback_windows_days: [14, 30, 90]

who_guideline_pollutants:
  - pollutant: "PM2.5"
    note: "WHO 2021 guideline pollutant; compare only with matching averaging period."
  - pollutant: "PM10"
