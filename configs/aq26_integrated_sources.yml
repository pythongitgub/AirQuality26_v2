satellite:
  bbox: [-0.15, 50.68, 0.35, 50.95]
  collections:
    odata_products:
      - L2__NO2___
      - L2__SO2___
      - L2__CO____
      - L2__HCHO__
      - L2__O3____
      - L2__CH4___
      - L2__AER_AI
  max_records_per_product: 50

thresholds:
  anomaly:
    news_minimum_attention_terms:
      - enforcement
      - breach
      - permit
      - variation
      - emission
      - exceedance
      - complaint
      - plume
      - incident
      - dioxin
      - particulate
      - nitrogen dioxide
      - sulphur dioxide
    official_relevance_terms:
      - newhaven
      - veolia
      - bv8067
      - incinerator
      - energy recovery
      - environment agency
      - permit
      - annual monitoring
      - emissions
      - waste
