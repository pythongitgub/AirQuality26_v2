project:
  name: "SCCNEXUS AirQuality26"
  timezone: "Europe/London"
  controlled_use_boundary: >
    Automated controlled-review evidence harvest. This is not a claim of endorsement
    by WHO, UNEP, EEA, C40 Cities, or any named expert. Causal attribution is not
    asserted unless explicit evidence gates support it.
methods_registry:
  methodological_principles:
    - {id: dominici_causal_big_data, label: "Causal inference / big-data epidemiology", implementation: "Guarded causal language, confounder notes, exposure windows and exposure-response readiness."}
    - {id: martin_satellite_ground_fusion, label: "Satellite remote sensing + ground monitoring fusion", implementation: "Catalogue Sentinel-5P products, retain QA metadata, use satellite as context until extraction and ground validation pass."}
    - {id: brauer_gbd_integrated_exposure, label: "Integrated exposure and health-burden framing", implementation: "Combine ground, satellite, meteorology and official records into exposure-screening tables without burden attribution."}
    - {id: anenberg_no2_emissions_health, label: "NO2 / emissions / health-impact tracking", implementation: "Prioritise NO2, SO2, CO, HCHO, O3, CH4, AER_AI and PM indicators with source/wind controls."}
    - {id: damoulas_urban_digital_twin, label: "Urban digital twin / spatiotemporal ML", implementation: "Maintain target-control site graph, date completeness, anomaly scoring and backfill queue."}
sites:
  - {id: newhaven_incinerator, label: "Newhaven Energy Recovery Facility / incinerator focus", lat: 50.796, lon: 0.055, role: source_focus, expected_streams: [waqi, openweather, metoffice, satellite, official_filings, news]}
  - {id: lewes, label: "Lewes control / context", lat: 50.873, lon: 0.008, role: control, expected_streams: [waqi, openweather, news]}
  - {id: eastbourne, label: "Eastbourne coastal control / context", lat: 50.768, lon: 0.290, role: control, expected_streams: [waqi, openweather, news]}
  - {id: brighton, label: "Brighton urban coastal context", lat: 50.822, lon: -0.137, role: urban_context, expected_streams: [waqi, openweather, news]}
  - {id: seaford_control, label: "Seaford coastal control / context", lat: 50.772, lon: 0.102, role: control, expected_streams: [waqi, openweather, news]}
