  - "Newhaven Energy Recovery Facility annual monitoring report"
  - "Newhaven incinerator annual monitoring report"
  - "Veolia Newhaven annual monitoring report"
  - "BV8067IL Newhaven"
  - "Newhaven energy recovery permit variation"
