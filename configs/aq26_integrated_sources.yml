project:
  name: "SCCNEXUS AirQuality26"
  timezone: "Europe/London"
  controlled_use_boundary: >
    Automated controlled-review evidence harvest. This is not a claim of endorsement
    by WHO, UNEP, EEA, C40 Cities, or any named expert. Causal attribution is not
    asserted unless explicit evidence gates support it.

sites:
  - id: newhaven_incinerator
    label: "Newhaven Energy Recovery Facility / incinerator focus"
    lat: 50.796
    lon: 0.055
    role: source_focus
  - id: lewes
    label: "Lewes control / context"
    lat: 50.873
    lon: 0.008
    role: control
  - id: eastbourne
    label: "Eastbourne coastal control / context"
    lat: 50.768
    lon: 0.290
    role: control
  - id: brighton
    label: "Brighton urban coastal context"
    lat: 50.822
    lon: -0.137
    role: urban_context
  - id: seaford_control
    label: "Seaford coastal control / context"
    lat: 50.772
    lon: 0.102
    role: control

