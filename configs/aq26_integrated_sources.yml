satellite:
  bbox: [-0.15, 50.68, 0.35, 50.95]
  collections:
    odata_products: [L2__NO2___, L2__SO2___, L2__CO____, L2__HCHO__, L2__O3____, L2__CH4___, L2__AER_AI]
  max_records_per_product: 50
thresholds:
  anomaly:
    official_relevance_terms: [newhaven, veolia, bv8067, bv8067il, incinerator, energy recovery, environment agency, permit, annual monitoring, emissions, waste, dioxin, furan, metals, exceedance, enforcement, variation]
  scoring:
    high_relevance_terms: [bv8067, bv8067il, newhaven energy recovery facility, veolia newhaven, annual monitoring report, environment agency, permit variation, enforcement notice]
    pollutant_terms: [pm2.5, pm10, no2, nitrogen dioxide, so2, sulphur dioxide, sulfur dioxide, co, carbon monoxide, ozone, o3, hcho, formaldehyde, ch4, methane, aerosol, dioxin, furan, mercury, cadmium, heavy metals]
