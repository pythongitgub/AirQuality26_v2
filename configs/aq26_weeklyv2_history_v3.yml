# AQ26 WeeklyV2 V3.2.1 historical backfill policy
history:
  weeks: 104
  default_end_date: "2026-05-25"
  window_convention: "start inclusive, end labelled upper bound, seven-day Monday-to-Monday slots"
  immutable_history_folder: "site_public/data/history"
  generated_public_index: "site_public/data/weekly_index.json"
  latest_live_summary: "site_public/data/latest_live_summary.json"
  latest_backfill_summary: "site_public/data/latest_backfill_summary.json"
  do_not_ingest_as_history:
    - "site_public/data/weekly_index.json"
    - "site_public/data/latest_summary.json"
    - "site_public/data/source_records_latest.json"
    - "site_public/data/charts/*.json"
validation:
  require_exact_week_count: true
  fail_on_duplicate_windows: true
  fail_on_harvested_zero_records: true
  fail_on_generated_aggregate_source: true
  fail_on_unreadable_csv: true
  external_submission_ready_requires_all_science_gates: true
backfill:
  batch_weeks_recommended: 4
  auto_next_missing_start_date: true
  skip_existing_before_applying_batch_limit: true
  force_rebuild_default: false
  source_priority:
    - openaq_ground_aq
    - official_ea_defra_data_gov
    - satellite_catalogue
    - weather_context
    - cams_if_configured
    - gdelt_context_optional_throttled
    - optional_ai_summary_non_blocking
  default_provider_policy:
    newsapi_enabled_during_backfill: false
    newsdata_enabled_during_backfill: false
    gdelt_enabled_during_backfill: true
    gdelt_min_seconds_between_requests: 6
    backfill_news_query_limit: 3
    gemini_enabled_during_backfill: false
    gemini_default_model: "gemini-3.5-flash"
secret_aliases:
  cdse_username_password_first: true
  cdse_client_id_aliases: ["CDSE_ID", "CDSE_CLIENT_ID"]
  cdse_client_secret_aliases: ["CDSE_SECRET", "CDSE_CLIENT_SECRET"]
  gemini_model_aliases: ["AQ26_GEMINI_MODEL", "GEMINI_MODEL"]
  newsapi_aliases: ["NEWSAPI_KEY", "NEWS_API_KEY"]
  newsdata_aliases: ["NEWSDATA_API_KEY", "NEWS_DATA_IO_KEY", "NEWSDATA_KEY"]
rollups:
  derive_drive_file_count_from_gdrive_source_record_count: true
  derive_satellite_product_count_from_satellite_metadata_records: true
  derive_news_warning_count_from_news_api_warning_records: true
